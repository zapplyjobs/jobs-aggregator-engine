name: Description Backfill (WD+SR)

# the main fetch pipeline. The main fetch-jobs workflow sets SKIP_WD_DESC_BACKFILL=1 +
# SKIP_SR_DESC_BACKFILL=1 + writes wd-desc-queue.jsonl (pending WD jobs with _raw).
# This workflow reads the WD queue (fetchWorkdayDescriptions) + reads all_jobs.json
# for SR jobs (fetchSRDescriptions), fetches up to 1000 descriptions each, appends
# to the sidecars, and uploads to R2. Observed cadence ~every 3-5 min as of 2026-09-06
# (GHA cron */10 + Worker dispatch) — clears backlogs faster while removing ~160s from the
# main fetch hot path.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# SUPPLEMENTAL dispatch + GHA cron fallback); the Worker's hasActiveWorkflowRun guard
# only prevents Worker-vs-Worker overlap. A cron+Worker pair could race: both drain the
# queue (wasting scarce WD-proxy quota) and — worse under the compacted full-file
# rewrite — last-writer-wins can DROP the other run's fetched entries. Queue, don't
# cancel (matches nightly-qa/collect-metrics): a long backfill finishes, the next tick
# runs after.
concurrency:
  group: desc-backfill-v1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      WD_FETCH_PROXY: https://wd-fetch-proxy.wild-queen-069e.workers.dev
      DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
      - name: "Mark sidecar generation in progress (AGG-DESCBACKFILL-MARKER-1)"
        run: |
          MARKER='{"status":"in_progress","run_id":"'"${GITHUB_RUN_ID}"'","started_at":"'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"}'
          printf '%s' "$MARKER" > /tmp/desc-backfill-complete.json
          # Storage backup second, bounded retry, non-fatal.
          node <<'EOF'
          const fs = require('fs');
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          async function main() {
            const marker = fs.readFileSync('/tmp/desc-backfill-complete.json');
            const r2 = createR2Client({ prefix: 'data/' });
            const ok = await r2.uploadRaw('desc-backfill-complete.json', marker, 'application/json');
            if (!ok) throw new Error('R2 marker upload returned false');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          EOF
          curl -sf --retry 3 --retry-delay 15 --retry-all-errors -X PUT \
            "${SUPABASE_URL}/storage/v1/object/pipeline-data/desc-backfill-complete.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/desc-backfill-complete.json \
            || echo "⚠️ Storage marker backup failed (non-fatal — R2 canonical marker written; AGG-MARKER-STORAGE-RETRY-1)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      

      - name: Seed sidecars + queue + all_jobs from R2 (canonical — post-recovery audit R2-1)
        run: |
          mkdir -p .github/data
          node << 'EOF'
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          const fs = require('fs');
          const r2 = createR2Client({ prefix: 'data/' });
          async function dl(name, dest) {
            try { await r2.downloadToFile(name, dest); console.log('✅ ' + name + ': ' + fs.statSync(dest).size + ' bytes (R2)'); }
            catch(e) { console.log('⚠️ ' + name + ': ' + e.message); }
          }
          (async () => {
            await dl('all_jobs.json', '.github/data/all_jobs.json');
            await dl('wd-desc-queue.jsonl', '.github/data/wd-desc-queue.jsonl');
            // WD sidecar (may be chunked in R2 as -1.jsonl, -2.jsonl, etc.)
            // AGG-WD-SIDECAR-LIFECYCLE-1 FIX: r2.downloadToFile returns NULL on a missing
            // key (it does NOT throw), so the old try/catch chunk fallback was dead code —
            // a missing single logged success and seeded 0 lines (observed 2026-08-14
            // 19:46Z: seeded 0, wrote 2,500, clobbered the 8,111-entry chunks). Check the
            // RESULT; fall back to chunks only when the single is genuinely absent.
            fs.writeFileSync('.github/data/descriptions-workday.jsonl', '');
            const single = await r2.downloadToFile('descriptions-workday.jsonl', '.github/data/descriptions-workday.jsonl');
            if (single) {
              console.log('✅ descriptions-workday: single file (R2, ' + single.size + ' bytes)');
            } else {
              console.log('single descriptions-workday.jsonl absent — concatenating chunks');
              for (let i = 1; i <= 24; i++) {
                const c = await r2.downloadToFile('descriptions-workday-' + i + '.jsonl', '/tmp/wd-' + i + '.jsonl');
                if (!c) break;
                fs.appendFileSync('.github/data/descriptions-workday.jsonl', fs.readFileSync('/tmp/wd-' + i + '.jsonl'));
                console.log('  WD chunk ' + i + ' (R2, ' + c.size + ' bytes)');
              }
            }
            console.log('descriptions-workday: ' + fs.readFileSync('.github/data/descriptions-workday.jsonl','utf8').trim().split('\n').filter(Boolean).length + ' lines');
            await dl('descriptions-smartrecruiters.jsonl', '.github/data/descriptions-smartrecruiters.jsonl');
          })();
          EOF
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


      - name: Fetch WD descriptions
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { fetchWorkdayDescriptions } = require('./.github/scripts/aggregator/lib/fetchers/workday-descriptions');
          const DATA_DIR = '.github/data';
          const allJobsPath = path.join(DATA_DIR, 'all_jobs.json');
          // AGG-WD-SIDECAR-LIFECYCLE-1 + AGG-STRING-CAP-READS + AUDIT FIX 2026-08-15:
          // everything inside async main() — node -e is CommonJS and ANY top-level await
          // (including for-await, and including awaiting an IIFE) is a runtime module-format
          // error that node --check cannot catch. This shape matches the working seed steps.
          async function main() {
            const poolIds = new Set();
            if (fs.existsSync(allJobsPath)) {
              const readline = require('readline');
              const rl = readline.createInterface({ input: fs.createReadStream(allJobsPath, 'utf8'), crlfDelay: Infinity });
              for await (const line of rl) {
                if (!line.trim()) continue;
                try { const j = JSON.parse(line); if (j && j.id) poolIds.add(j.id); } catch {}
              }
              rl.close();
            }
            console.log('Pool ids for sidecar prune:', poolIds.size);
            const queuePath = path.join(DATA_DIR, 'wd-desc-queue.jsonl');
            if (!fs.existsSync(queuePath)) { console.log('No WD queue — skipping WD backfill'); return; }
            const queueLines = fs.readFileSync(queuePath, 'utf8').trim().split('\n').filter(Boolean);
            const wdJobs = queueLines.map(line => {
              const q = JSON.parse(line);
              return { id: q.id, location: q.location || '', _raw: { externalPath: q.externalPath, baseUrl: q.baseUrl, site: q.site } };
            });
            console.log('WD queue:', wdJobs.length, 'jobs pending');
            const start = Date.now();
            const desc = await fetchWorkdayDescriptions(wdJobs, DATA_DIR, { poolIds });
            console.log('WD done:', desc.size, 'cached (' + Math.round((Date.now()-start)/1000) + 's)');
          }
          main().catch(e => { console.error('WD error:', e.message); process.exitCode = 1; });
          "


      - name: Fetch SR descriptions
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { fetchSRDescriptions } = require('./.github/scripts/aggregator/lib/fetchers/smartrecruiters-descriptions');
          const DATA_DIR = '.github/data';
          const allJobsPath = path.join(DATA_DIR, 'all_jobs.json');
          // AUDIT FIX 2026-08-15: everything inside async main() — no top-level await in
          // node -e (CommonJS). One streaming pass builds srJobs + the full-pool id set
          // (AGG-STRING-CAP-READS + AGG-WD-SIDECAR-LIFECYCLE-1).
          async function main() {
            if (!fs.existsSync(allJobsPath)) { console.log('No all_jobs.json — skipping SR backfill'); return; }
            const srJobs = [];
            const poolIds = new Set();
            const readline = require('readline');
            const rl = readline.createInterface({ input: fs.createReadStream(allJobsPath, 'utf8'), crlfDelay: Infinity });
            for await (const line of rl) {
              if (!line.trim()) continue;
              try {
                const j = JSON.parse(line);
                if (j && j.id) poolIds.add(j.id);
                if (j && j.source === 'smartrecruiters' && j.company_slug) srJobs.push(j);
              } catch {}
            }
            rl.close();
            console.log('SR jobs:', srJobs.length, 'total');
            const start = Date.now();
            const desc = await fetchSRDescriptions(srJobs, DATA_DIR, { poolIds });
            console.log('SR done:', desc.size, 'cached (' + Math.round((Date.now()-start)/1000) + 's)');
          }
          main().catch(e => { console.error('SR error:', e.message); process.exitCode = 1; });
          "

      - name: "Verify sidecar integrity (AGG-SIDECAR-ATOMIC-WRITE-1 + AGG-WD-SIDECAR-LIFECYCLE-1)"
        run: |
          # (descriptions-workday-1..N.jsonl) — sum lines across all WD files.
          WD_LINES=$(cat .github/data/descriptions-workday*.jsonl 2>/dev/null | wc -l)
          if [ "$WD_LINES" -lt 500 ]; then
            echo "⚠️ WD sidecar has only $WD_LINES lines (expected 5000+). Possible seed-download failure."
            echo "Skipping upload to prevent data loss — existing Storage sidecar preserved."
            echo "SKIP_UPLOAD=true" >> $GITHUB_ENV
          else
            echo "✅ WD sidecar OK: $WD_LINES lines"
          fi

      - name: "Upload sidecars to Supabase Storage"
        id: upload
        if: success() && env.SKIP_UPLOAD != 'true'
        continue-on-error: true
        run: node .github/scripts/upload-to-storage.js --bucket pipeline-data --data-dir .github/data --include-wd-sr
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: "Prune superseded R2 sidecar objects (AGG-WD-SIDECAR-LIFECYCLE-1)"
        if: success() && env.SKIP_UPLOAD != 'true' && steps.upload.outcome == 'success'
        continue-on-error: true
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          (async () => {
            const r2 = createR2Client({ prefix: 'data/' });
            const DATA_DIR = '.github/data';
            const local = new Set(fs.readdirSync(DATA_DIR));
            const toDelete = [];
            // Deterministic sweep: canonical WD objects are descriptions-workday[-N].jsonl.
            // Any indexed chunk not present locally (e.g. orphaned 1-byte remnants from the
            // Storage-chunk era, or a chunk-count shrink) is superseded and must not persist.
            for (let i = 1; i <= 24; i++) {
              const name = 'descriptions-workday-' + i + '.jsonl';
              if (!local.has(name)) toDelete.push(name);
            }
            // Chunked present locally => the single-file object is also superseded.
            const hasWdChunks = [...local].some(f => /^descriptions-workday-\d+\.jsonl$/.test(f));
            if (hasWdChunks && !local.has('descriptions-workday.jsonl')) toDelete.push('descriptions-workday.jsonl');
            if (toDelete.length === 0) { console.log('R2 sidecar prune: nothing superseded'); return; }
            console.log('R2 sidecar prune candidates:', toDelete.join(', '));
            try {
              await r2.deleteObjects(toDelete);
              console.log('R2 sidecar prune: deleted ' + toDelete.length + ' superseded object(s)');
            } catch (e) { console.log('R2 sidecar prune failed (non-fatal): ' + e.message); }
          })();
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: "Write sidecar completion marker (AGG-DESCBACKFILL-MARKER-1)"
        if: always()
        run: |
          STATUS=complete
          if [ "${{ steps.upload.outcome }}" != "success" ] || [ "${SKIP_UPLOAD:-}" = "true" ]; then STATUS=failed; fi
          WD_LINES=$(cat .github/data/descriptions-workday*.jsonl 2>/dev/null | wc -l)
          SR_LINES=$(wc -l < .github/data/descriptions-smartrecruiters.jsonl 2>/dev/null || echo 0)
          COMPLETED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"sidecars_written_at\":\"${COMPLETED_AT}\",\"wd_entries\":${WD_LINES},\"sr_entries\":${SR_LINES},\"status\":\"${STATUS}\",\"run_id\":\"${GITHUB_RUN_ID}\"}" > /tmp/desc-backfill-complete.json
          node <<'EOF'
          // AGG-WORKFLOW-STAGETIMINGS-1: per-step durations (kv map, ms integers, step
          // names) from the Jobs API, folded INTO the completion marker (no separate
          // artifact; additive fields only). Fail-open: never blocks the marker.
          async function addStageTimings() {
            const headers = { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' };
            let job = null;
            try {
              const r = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/jobs/${process.env.JOB_ID}`, { headers });
              if (r.ok) job = await r.json();
            } catch {}
            if (!job || !Array.isArray(job.steps)) {
              try {
                const r2 = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs`, { headers });
                const j = r2.ok ? await r2.json() : null;
                job = ((j && j.jobs) || []).find((x) => String(x.id) === String(process.env.JOB_ID) || x.name === process.env.GITHUB_JOB) || job;
              } catch {}
            }
            if (!job || !Array.isArray(job.steps)) { console.log('stage timings: job steps unavailable (non-fatal)'); return; }
            const stage_timings = {};
            for (const s of job.steps) {
              if (!s.started_at || !s.completed_at) continue;
              stage_timings[s.name] = Math.max(0, Math.round(new Date(s.completed_at) - new Date(s.started_at)));
            }
            const fs = require('fs');
            const marker = JSON.parse(fs.readFileSync('/tmp/desc-backfill-complete.json', 'utf8'));
            marker.stage_timings = stage_timings;
            fs.writeFileSync('/tmp/desc-backfill-complete.json', JSON.stringify(marker), 'utf8');
            console.log('stage timings: folded into marker (' + Object.keys(stage_timings).length + ' steps)');
          }
          addStageTimings().catch((err) => console.log('stage timings: skipped (' + err.message + ') - non-fatal'));
          EOF
          # Storage backup second, bounded retry, non-fatal.
          node <<'EOF'
          const fs = require('fs');
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          async function main() {
            const marker = fs.readFileSync('/tmp/desc-backfill-complete.json');
            const r2 = createR2Client({ prefix: 'data/' });
            const ok = await r2.uploadRaw('desc-backfill-complete.json', marker, 'application/json');
            if (!ok) throw new Error('R2 marker upload returned false');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          EOF
          curl -sf --retry 3 --retry-delay 15 --retry-all-errors -X PUT \
            "${SUPABASE_URL}/storage/v1/object/pipeline-data/desc-backfill-complete.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/desc-backfill-complete.json \
            || echo "⚠️ Storage marker backup failed (non-fatal — R2 canonical marker written; AGG-MARKER-STORAGE-RETRY-1)"
          echo "Marker: ${STATUS} at ${COMPLETED_AT} (WD=${WD_LINES}, SR=${SR_LINES})"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GITHUB_TOKEN: ${{ github.token }}
          JOB_ID: ${{ github.job }}

      # marker at in_progress forever (cancellation skips the completion write), so the
      # enrich gate burned its 7m+3m wait caps polling a zombie (C248 livelock). This
      # step runs ONLY on cancellation and flips OUR OWN in_progress marker to failed
      # (double guard: run_id match AND status still in_progress - never touches a
      # successor's marker and never downgrades a completed run). The gate fails fast
      # on status=failed; the next successful backfill write restores complete.
      - name: "Flip marker to failed on cancellation (AGG-DESCBACKFILL-CANCELRACE-1)"
        if: cancelled()
        run: |
          node <<'EOF'
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const current = await r2.downloadJson('desc-backfill-complete.json');
            if (!current || current.status !== 'in_progress') {
              console.log('Marker status ' + (current ? current.status : 'missing') + ' - nothing to clean up');
              return;
            }
            if (String(current.run_id) !== String(process.env.GITHUB_RUN_ID)) {
              console.log('Marker run_id ' + current.run_id + ' != ' + process.env.GITHUB_RUN_ID + ' - a newer run owns it; not touching');
              return;
            }
            const marker = JSON.stringify({ status: 'failed', run_id: process.env.GITHUB_RUN_ID, started_at: current.started_at || null, note: 'run cancelled mid-flight (AGG-DESCBACKFILL-CANCELRACE-1)' });
            const ok = await r2.uploadRaw('desc-backfill-complete.json', marker, 'application/json');
            console.log(ok ? 'Marker flipped to failed (cancelled run, run_id guarded)' : 'R2 marker upload returned false (non-fatal)');
          }
          main().catch(err => { console.error('cleanup failed (non-fatal): ' + err.message); });
          EOF
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
