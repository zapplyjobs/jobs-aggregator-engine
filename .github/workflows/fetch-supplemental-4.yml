name: Supplemental Ingest 4

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
concurrency:
  group: fetch-oracle-supplemental
  cancel-in-progress: false

jobs:
  fetch-oracle-supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory
        run: mkdir -p .github/data
      - name: Seed Oracle cache and board snapshot from R2
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
          const fs = require('fs');
          async function downloadMaybe(r2, key, file) {
            const result = await r2.downloadToFile(key, file);
            console.log((result ? 'R2_OK' : 'R2_MISS') + ' ' + key);
            return result; // AGG-ORACLE-SIDECAR-CHUNK-1 (F2): the all-or-nothing count reads this
          }
          // AGG-ORACLE-SIDECAR-CHUNK-1: the sidecar may be a single file OR N chunks
          // (descriptions-oracle[-N].jsonl) - seed the live SET from the R2 listing, never
          // assume the single-file name. Stale local sidecars are removed so the lane's
          // merge seed matches the remote truth.
          const SIDECAR_RE = /^descriptions-oracle(-\d+)?\.jsonl$/;
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            let seededSidecar = false;
            let countMismatch = null;
            try {
              const remote = await r2.list('descriptions-oracle');
              for (const name of fs.readdirSync('.github/data')) {
                if (SIDECAR_RE.test(name)) fs.rmSync('.github/data/' + name, { force: true });
              }
              // AGG-ORACLE-SIDECAR-CHUNK-1 (OracleChunkReview F2): all-or-nothing seed.
              // A partial seed merged + republished would silently drop the missing
              // chunk's rows from the live set (the R2LOSS-1 class). downloadToFile never
              // throws (logs + returns null), so count successes vs listed keys and hard-fail
              // on any gap; the next cron run retries from a clean slate (partial-list guard
              // semantics). Count mismatch fails the STEP (the swallow below was removed).
              let expected = 0, got = 0;
              for (const o of remote) {
                const short = String(o.key || '').replace(/^data\//, '');
                if (!SIDECAR_RE.test(short)) continue;
                expected++;
                const r = await downloadMaybe(r2, short, '.github/data/' + short);
                if (r) got++;
              }
              if (expected > 0 && got !== expected) {
                countMismatch = got + '/' + expected;
              } else if (expected > 0) {
                seededSidecar = true;
              }
            } catch (e) {
              console.log('sidecar set seed unavailable (' + e.message + ') - falling back to single-name seed');
            }
            if (countMismatch) throw new Error('oracle sidecar seed incomplete: downloaded ' + countMismatch + ' listed chunks - refusing to run the lane on a partial cache (R2LOSS-1 guard)');
            if (!seededSidecar) await downloadMaybe(r2, 'descriptions-oracle.jsonl', '.github/data/descriptions-oracle.jsonl');
            await downloadMaybe(r2, 'supplemental-oracle-metadata.json', '.github/data/supplemental-oracle-metadata.json'); // AGG-ORACLE-SIDECAR-BIMODAL-1: prior total for the partial-list guard
          }
          main().catch((e) => { console.error('❌ seed failed:', e.message); process.exit(1); });
          " && echo "✅ Seeded Oracle cache/snapshot"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


      - name: Fetch Oracle supplemental lane
        run: node .github/scripts/fetch-supplemental-oracle.js
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Verify output files
        run: |
          test -f .github/data/supplemental-oracle-jobs.json
          test -f .github/data/supplemental-oracle-metadata.json
          python3 - <<'PY'
          import json
          jobs = json.load(open('.github/data/supplemental-oracle-jobs.json'))
          meta = json.load(open('.github/data/supplemental-oracle-metadata.json'))
          assert isinstance(jobs, list)
          assert isinstance(meta.get('jobs_fetched'), int)
          assert meta.get('source') == 'oracle'
          assert meta.get('schema') in ('supplemental-lane-v1', 'supplemental-lane-v2')
          assert meta.get('lane_name') == 'oracle'
          contract = meta.get('publish_contract') or {}
          assert contract.get('blocks_fast_publish') is False
          assert contract.get('included_in_main_all_jobs') is False
          assert contract.get('merge_mode') == 'separate_artifact'
          assert contract.get('visibility') == 'snapshot_only'
          print('jobs', len(jobs))
          print('meta_jobs', meta['jobs_fetched'])
          PY

      - name: Display Oracle supplemental summary
        if: always()
        run: |
          cat .github/data/supplemental-oracle-metadata.json | jq .


      - name: "Dual-write to Supabase Storage (R2-elim)"
        if: always()
        continue-on-error: true
        run: |
          BASE="https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data"
          for f in supplemental-oracle-jobs.json supplemental-oracle-metadata.json; do
            if [ -f ".github/data/$f" ]; then
              curl -sf -X PUT -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
                --data-binary @".github/data/$f" "$BASE/$f" && echo "$f: OK" || echo "$f: FAIL"
            fi
          done
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}