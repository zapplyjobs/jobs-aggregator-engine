name: Check Link Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: write


jobs:
  link-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed stale candidate history from Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/storage/v1/object/pipeline-data/stale-job-history.json" -o stale-job-history.prev.json 2>/dev/null && echo "seeded stale-job-history.prev" || echo "no prior stale-job-history"
          curl -sf -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/storage/v1/object/pipeline-data/jobs-metadata.json" -o jobs-metadata.json 2>/dev/null && echo "seeded jobs-metadata" || echo "no prior jobs-metadata"

      - name: Priority probes - reported URLs (AGG-LINKTRUTH-FULLCOVERAGE-1 item 4)
        id: priority-probes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # AGG-LINKTRUTH item 4 / OUT-DEADLINK-INTAKE-HANDOFF-1: dev-QA reported URLs ride
          # the EXISTING url-file mode as priority probes - no new workflow, no new alert
          # surface. OUT publishes data/reports/dead-link-reported-urls.txt (one URL per
          # line, # comments allowed). Probes run BEFORE the sample pass so priority dead
          # entries merge into the same history -> tombstone pipeline the sample uses.
          # Absent/empty file = loud skip (defensive, same rule as the exclusion loader).
          if aws s3 cp "s3://${R2_BUCKET_NAME}/data/reports/dead-link-reported-urls.txt" ./reported-urls.txt --endpoint-url "${R2_ENDPOINT}" --region auto; then
            N=$(grep -cv -e '^#' -e '^$' reported-urls.txt || true)
            if [ "${N:-0}" -gt 0 ]; then
              echo "Priority probes: $N reported URL(s) found - probing"
              set +e
              node .github/scripts/check-link-health.js --url-file reported-urls.txt --history-in stale-job-history.prev.json --write-history reported-history.json > priority-probe-report.json
              PEXIT=$?
              set -e
              echo "priority_probe_exit=$PEXIT (1 = dead link among reported URLs - expected, not a step failure)"
              PDEAD=$(python3 -c "import json;d=json.load(open('priority-probe-report.json'));print(d.get('dead',0))" 2>/dev/null || echo '?')
              echo "PRIORITY_PROBE_DEAD=$PDEAD" >> "$GITHUB_OUTPUT"
              echo "### Priority probes (reported URLs)" >> "$GITHUB_STEP_SUMMARY"
              echo "- probed $N url(s), dead: $PDEAD" >> "$GITHUB_STEP_SUMMARY"
              cp reported-history.json stale-job-history.prev.json
            else
              echo "reported-urls file present but empty of URLs - priority pass skipped"
              echo "PRIORITY_PROBE_DEAD=0" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "no data/reports/dead-link-reported-urls.txt on R2 yet - priority pass skipped (OUT publish pending)"
            echo "PRIORITY_PROBE_DEAD=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AGG link health sample
        id: link-health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # AGG-DEADNESS-1: check-link-health.js exits 1 when dead jobs are found (dead-alert signal).
          # The Simplify age-bypass now reliably detects the persistently-410 BAE class, so dead>0 is
          # the common case. Decouple that exit from the derived-artifact builders below so tombstone /
          # verification / confidence artifacts still refresh on dead-detecting runs, then re-emit the
          # original exit code to preserve the dead-alert (red workflow) signal. The primary dead list
          # (stale-job-candidates.json) is written before the exit; uploaded via the validated flag below (AGG-LINT-FIX: upload-on-validation-passed) so dead-detect evidence still publishes but invalid/failed-build artifacts do NOT reach R2.
          set +e
          node .github/scripts/check-link-health.js --per-group 8 --write-dead stale-job-candidates.json --history-in stale-job-history.prev.json --write-history stale-job-history.json > agg-link-health.json
          CHECK_EXIT=$?
          set -e
          node .github/scripts/build-stale-tombstones.js --history-in stale-job-history.json --output stale-job-tombstones.json
          node .github/scripts/build-link-verification-sample.js --input agg-link-health.json --output link-verification-sample.json
          node .github/scripts/build-source-confidence-sample.js --link-health agg-link-health.json --verification link-verification-sample.json --tombstones stale-job-tombstones.json --metadata jobs-metadata.json --output source-confidence-sample.json
          node .github/scripts/validate-link-health-artifacts.js --print-summary
          echo "validated=true" >> "$GITHUB_OUTPUT"
          exit $CHECK_EXIT

      - name: Upload stale candidate outputs to Storage
        if: steps.link-health.outputs.validated == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for f in agg-link-health.json stale-job-candidates.json stale-job-history.json stale-job-tombstones.json link-verification-sample.json source-confidence-sample.json; do
            [ -f "$f" ] && curl -sf -X PUT -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" --data-binary @"$f" "$SUPABASE_URL/storage/v1/object/pipeline-data/$f" && echo "uploaded $f" || echo "skip $f"
          done

      - name: Upload stale candidate outputs to R2 (canonical — AGG-R2PRIMARY-NONBRIDGE-GAPS-1)
        if: steps.link-health.outputs.validated == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # aws-cli (preinstalled) + R2 S3-compatibility — no submodule needed (the node r2-client lives in the aggregator submodule, not checked out here).
          for f in agg-link-health.json stale-job-candidates.json stale-job-history.json stale-job-tombstones.json link-verification-sample.json source-confidence-sample.json; do
            if [ -f "$f" ]; then
              aws s3 cp "$f" "s3://${R2_BUCKET_NAME}/data/$f" --endpoint-url "${R2_ENDPOINT}" --region auto && echo "R2 uploaded $f" || echo "R2 FAIL $f"
            fi
          done

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agg-link-health
          path: |
            agg-link-health.json
            priority-probe-report.json
            reported-urls.txt
            stale-job-candidates.json
            stale-job-history.json
            stale-job-tombstones.json
            link-verification-sample.json
            source-confidence-sample.json
          retention-days: 14
