          }'
        fi

    - name: Push archive to jobs-archive-private
      if: success()
      run: |
        ARCHIVE_DIR=".github/data/archive"
        if [ ! -d "$ARCHIVE_DIR" ] || [ -z "$(ls -A $ARCHIVE_DIR 2>/dev/null)" ]; then
          echo "ℹ️ No archive files to push"
          exit 0
        fi

        echo "📤 Pushing archive files to jobs-archive-private..."
        git clone --depth=1 "https://x-access-token:${GH_PAT}@github.com/zapplyjobs/jobs-archive-private.git" /tmp/jobs-archive-private

        # Copy all weekly archive files
        mkdir -p /tmp/jobs-archive-private/data
        cp $ARCHIVE_DIR/*.jsonl /tmp/jobs-archive-private/data/ 2>/dev/null || true

        cd /tmp/jobs-archive-private
        git config user.email "bot@zapplyjobs.com"
        git config user.name "Data Bot"
        git add data/

        if [ -n "$(git status --porcelain)" ]; then
          WEEK=$(ls data/*.jsonl 2>/dev/null | tail -1 | xargs basename 2>/dev/null || echo "unknown")
          git commit -m "archive: update ${WEEK} - $(date -u +%Y-%m-%d)"
          PUSHED=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSHED=true
              break
            fi
            echo "Archive push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::Archive push failed after 3 attempts"
            exit 1
          fi
          echo "✅ Archive pushed to jobs-archive-private"
        else
          echo "ℹ️ No new archive data to push"
        fi
      env:
        GH_PAT: ${{ secrets.GH_PAT }}

    - name: Mirror archive to R2
      if: success()
      run: |
        ARCHIVE_DIR=".github/data/archive"
        if [ ! -d "$ARCHIVE_DIR" ] || [ -z "$(ls -A $ARCHIVE_DIR 2>/dev/null)" ]; then
          echo "ℹ️ No archive files to mirror"
          exit 0
        fi
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const fs = require('fs');
        const path = require('path');
        async function main() {
          const r2 = createR2Client({ prefix: 'archive/' });
          const dir = '.github/data/archive';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.jsonl'));
          if (files.length === 0) {
            console.log('Archive R2 mirror: no archive files found');
            return;
          }
          let ok = 0;
          const failed = [];
          for (const f of files) {
            const data = fs.readFileSync(path.join(dir, f), 'utf8');
            const uploaded = await r2.uploadRaw(f, data, 'application/x-jsonlines');
            if (uploaded) ok++;
            else failed.push(f);
          }
          console.log('Archive R2 mirror: ' + ok + '/' + files.length + ' files uploaded');
          if (failed.length > 0) {
            throw new Error('Archive R2 mirror failed for: ' + failed.join(', '));
          }
        }
        main().catch(e => { console.error('Archive R2 mirror failed: ' + e.message); process.exit(1); });
        "
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: Notify on failure
      if: failure()
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
        CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
      run: |
        echo "❌ Workflow failed - check logs above"
        echo "Last 30 lines of fetch log:"
        tail -30 .github/logs/fetch.log || echo "No log file"

        # Send Discord alert (INF-ALERT-5)
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        DETAIL=""
        if [ -d ".github/scripts/aggregator" ]; then
          FC=$(find .github/scripts/aggregator -type f | wc -l)
          if [ "$FC" -lt 30 ]; then DETAIL="Aggregator submodule: only $FC files."; fi
          for f in company-list.json tag-engine.js workday.js; do
            if ! find .github/scripts/aggregator -name "$f" -type f -print -quit | grep -q .; then
              DETAIL="${DETAIL} Missing: $f."
            fi
          done
        else
          DETAIL="Aggregator submodule directory MISSING."
        fi
        MSG="🚨 **Pipeline Failure**\n${DETAIL:-Check logs.}\n• Run: ${RUN_URL}\n• Time: ${TS}"
        PAYLOAD=$(printf '{"content":"%s"}' "$MSG")
        curl -sf -X POST "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" \
          -H "Authorization: Bot ${DISCORD_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" || echo "Discord alert failed (non-blocking)"
