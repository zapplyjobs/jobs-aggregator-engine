name: Fetch All Jobs

on:
  workflow_dispatch:
  # schedule REMOVED (INF-FETCHJOBS-DUAL-TRIGGER-1): the CF Worker job-board-cron-worker
  # (observed dispatch every 10 min as of 2026-09-06, with hasActiveWorkflowRun guard) is the
  # SOLE trigger. GHA schedule caused a dual-trigger that doubled dispatches + piled the
  # throttled queue (ghost-throttle P0).

# Prevent concurrent runs
concurrency:
  group: job-fetch-v2  # AGG-GHOST-RUN-CADENCE-BLOCK-1: renamed to escape 10 ghost queued runs (uncancellable HTTP 500, stuck >24h from Aug-4 outage) blocking the old "job-fetch" group
  cancel-in-progress: false

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      NODE_OPTIONS: --max-old-space-size=14000  # AGG-FETCH-OOM-MEMORY-OPTIMIZATION-1 Phase 0 (operator-approved session, 2026-08-15): raised from 6656. The old comment's '7GB runner' premise was WRONG — this repo is PUBLIC and ubuntu-latest runners give 16GB/4vCPU free (verified: repo visibility + runs-on + GitHub docs). 14000 leaves ~2GB for OS/runner agent. This is a BRIDGE, not the fix: peak memory scales with pool size (~90KB/job, 74K pool measured ~6.6GB); the durable fix (stream writes, release fat set) is phased in the task record + projects/zjp/research/AGG_FETCH_MEMORY_ARCHITECTURE_2026_08_14.md.
      SKIP_WD_FAMILY_CACHE_BUILD: 1
      SKIP_WD_DESC_BACKFILL: '1'  # AGG-DESC-ASYNC-1: WD desc backfill moved to separate workflow
      SKIP_SR_DESC_BACKFILL: '1'  # AGG-DESC-ASYNC-1: SR desc backfill moved to separate workflow
      WD_FETCH_PROXY: https://wd-fetch-proxy.wild-queen-069e.workers.dev  # AGG-WD-PROXY-WIRE-1: bypass GHA Cloudflare IP-block
      DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}  # AGG-WD-PROXY-AUTH-HEADER-1: auth token for wd-fetch-proxy
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}  # AGG-R2ELIM-READMIGRATION-1: Storage-first reads via r2-client.js
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 1  # Shallow clone — rebase fetches missing objects on demand
        submodules: recursive
        token: ${{ secrets.GH_PAT }}

    - name: Record workflow start (AGG-B2 clock anchor)
      # AGG-B2-DEADLINE-PERSIST-IMPL-1: moved the workflow-start.txt stamp write here
      # from "Create logs directory" (was after transcrypt/setup/npm-ci). The engine
      # clock must anchor as close to the JOB deadline as possible - the later stamp
      # made T-degrade short by the whole setup offset (~1.5-4 min observed). The
      # first runner step after provisioning+checkout is the earliest capture point
      # a run: step can get (checkout itself is a uses: step).
      run: |
        mkdir -p .github/data
        date -u +%s > .github/data/workflow-start.txt

    - name: Install transcrypt
      run: |
        curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
        chmod +x /tmp/transcrypt
        sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

    - name: Unlock encrypted files
      run: |
        echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
        git checkout -- .
        git submodule foreach --recursive '
          echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
          rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
          git checkout HEAD -- . 2>/dev/null || true
        ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          # The foreach above uses || true (historical fragile unlock). This catches
          # a silent decryption failure BEFORE the pipeline runs ciphertext garbage.
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
      env:
        TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


    - name: Fix submodule index
      run: |
        # Workaround for GitHub Actions submodule checkout caching issue
        # Force git to recompute submodule index from the tree
        git submodule sync --recursive
        git submodule update --init --force --recursive

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tag-engine tests (non-blocking — tag-engine.js is git-crypt encrypted)
      continue-on-error: true
      run: cd .github/scripts/shared && [ -f lib/aggregator/processors/tag-engine.js ] && node lib/__tests__/tag-engine.test.js || echo "⚠️ tag-engine.js not decrypted — skipping tests"

    - name: Create logs directory
      run: |
        mkdir -p .github/logs .github/data
        # (workflow-start.txt stamp moved to "Record workflow start" right after Checkout
        # - AGG-B2-DEADLINE-PERSIST-IMPL-1; do not rewrite it here, it would shrink the
        # engine's degrade margin by the setup offset again.)

    - name: "Seed pipeline artifacts from R2 (parallel — AGG-RUNTIME-L0-1)"
      # AGG-RUNTIME-WALL-ALERT-GAP-1 lever L0: the 12 inline seed steps extracted to
      # seed-r2-artifacts.js (AGG-SEEDSTEP-EXTRACT-1 pattern) with a bounded parallel
      # pool. Only all_jobs is fatal; all other misses fall back softly. Log-line
      # vocabulary is byte-compatible with the old steps.
      run: node .github/scripts/seed-r2-artifacts.js
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        GH_TOKEN: ${{ secrets.GH_PAT }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


    - name: "Seed supplemental lane artifacts from R2"
      run: |
        echo "📥 Seeding supplemental lane artifacts..."
        node .github/scripts/seed-supplemental-lane.js && echo "✅ Supplemental artifacts seeded from R2" || echo "⚠️ No supplemental artifacts available yet"
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: Pre-pipeline integrity check
      run: |
        echo "🔍 Pre-pipeline integrity check (TAG-AUDIT-4)..."
        FAIL=false

        # Count files in aggregator submodule (should be ~46)
        AGG_DIR=".github/scripts/aggregator"
        if [ -d "$AGG_DIR" ]; then
          FILE_COUNT=$(find "$AGG_DIR" -type f | wc -l)
          if [ "$FILE_COUNT" -lt 30 ]; then
            echo "❌ Aggregator submodule has only $FILE_COUNT files (expected ~46) — incomplete tree!"
            FAIL=true
          else
            echo "✅ Aggregator submodule: $FILE_COUNT files"
          fi
        else
          echo "❌ Aggregator submodule directory missing!"
          FAIL=true
        fi

        # Critical file checks (must exist with reasonable size)
        declare -A CRITICAL_FILES=(
          ["$AGG_DIR/lib/processors/tag-engine.js"]=3000
          ["$AGG_DIR/lib/processors/tag-monitor.js"]=500
          ["$AGG_DIR/lib/processors/senior-filter.js"]=100
          ["$AGG_DIR/lib/processors/deduplicator.js"]=100
          ["$AGG_DIR/lib/fetchers/company-list.json"]=50000
          ["$AGG_DIR/lib/fetchers/workday.js"]=200
          ["$AGG_DIR/lib/fetchers/greenhouse.js"]=200
          ["$AGG_DIR/lib/fetchers/ashby.js"]=200
          ["$AGG_DIR/lib/fetchers/lever.js"]=200
          ["$AGG_DIR/lib/storage/r2-client.js"]=100
        )

        for file in "${!CRITICAL_FILES[@]}"; do
          min_size=${CRITICAL_FILES[$file]}
          basename=$(basename "$file")
          if [ ! -f "$file" ]; then
            echo "❌ $basename MISSING"
            FAIL=true
          else
            size=$(wc -c < "$file")
            if [ "$size" -lt "$min_size" ]; then
              echo "❌ $basename: $size bytes (expected >$min_size) — likely truncated"
              FAIL=true
            else
              echo "✅ $basename: $size bytes"
            fi
          fi
        done

        if [ "$FAIL" = "true" ]; then
          echo "❌ Pre-pipeline integrity check FAILED — aborting to prevent corrupt output"
          exit 1
        fi
        echo "✅ All integrity checks passed"

    - name: Generate link-health data for metadata (AGG-DEADLINK-PUBLISH-1)
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const fs = require('fs');
        const path = require('path');
        const DATA_DIR = '.github/data';
        const r2 = createR2Client({ prefix: 'data/' });
        (async () => {
          const linkHealth = [];
          for (const file of ['stale-job-tombstones.json', 'stale-job-candidates.json']) {
            const local = path.join(DATA_DIR, file);
            const ok = await r2.downloadToFile(file, local);
            if (!ok) { console.log('  ' + file + ': not available'); continue; }
            const data = JSON.parse(fs.readFileSync(local, 'utf8'));
            const items = data.tombstones || data.dead || [];
            for (const item of items) {
              if (!item.url) continue;
              linkHealth.push({
                repo: item.source || item.group || 'unknown',
                url: item.url,
                status: item.latest_status || 'dead',
                last_checked: item.last_dead_seen_at || item.first_dead_seen_at || null,
                http_code: item.latest_code || null,
                company: item.company_name || null,
                title: (item.title || '').slice(0, 80),
              });
            }
          }
          fs.writeFileSync(path.join(DATA_DIR, 'link-health.json'), JSON.stringify(linkHealth));
          console.log('📋 link-health: ' + linkHealth.length + ' dead links found');
        })().catch(e => { console.error('⚠️ link-health generation failed (non-blocking): ' + e.message); });
        "

    - name: "Fetch jobs from all sources"
      run: set -o pipefail; node .github/scripts/index.js 2>&1 | tee .github/logs/fetch.log
      env:
        JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

    - name: "Upload degrade checkpoint pool (AGG-B2 diagnosis artifact - never seeded)"
      # AGG-B2-DEADLINE-PERSIST-IMPL-1 alternative A: near-cap pool snapshot for
      # post-mortem fidelity. GitHub Actions artifact ONLY - deliberately outside the
      # R2 descriptions-* namespace and the seed-r2-artifacts.js target list, so no
      # seed or consumer path can ever read it (falsifier E).
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b2-checkpoint-pool
        path: .github/data/checkpoint_pool.json
        if-no-files-found: ignore

    - name: Post-deploy invariant checks
      run: |
        echo "🔍 Running post-deploy invariant checks..."
        PASS=true

        # 1. all_jobs.json exists and has >20,000 lines
        if [ ! -f ".github/data/all_jobs.json" ]; then
          echo "❌ all_jobs.json missing"
          PASS=false
        else
          LINE_COUNT=$(wc -l < .github/data/all_jobs.json)
          if [ "$LINE_COUNT" -lt 20000 ]; then
            echo "❌ all_jobs.json: $LINE_COUNT lines (expected >20000)"
            PASS=false
          else
            echo "✅ all_jobs.json: $LINE_COUNT lines"
          fi
        fi

        # AGG-US-SNAPSHOT-1: us_jobs.json mirrors the producer-owned US tag contract.
        if [ ! -f ".github/data/us_jobs.json" ]; then
          echo "❌ us_jobs.json missing"
          PASS=false
        else
          US_CHECK=$(python3 -c "
        import json
        total = 0
        bad = 0
        with open('.github/data/us_jobs.json') as f:
          for line in f:
            line = line.strip()
            if not line: continue
            total += 1
            j = json.loads(line)
            if 'us' not in ((j.get('tags') or {}).get('locations') or []):
              bad += 1
        print(f'{total}:{bad}')
        " 2>/dev/null || echo "0:1")
          US_COUNT="${US_CHECK%%:*}"
          US_BAD="${US_CHECK##*:}"
          if [ "$US_COUNT" -lt 10000 ] || [ "$US_BAD" -ne 0 ]; then
            echo "❌ us_jobs.json invalid: $US_COUNT rows, $US_BAD non-US-tagged rows"
            PASS=false
          else
            echo "✅ us_jobs.json: $US_COUNT US-tagged rows"
          fi
        fi

        # 2. tags object present on a sample of records
        TAGGED=$(head -5 .github/data/all_jobs.json | python3 -c "
        import sys, json
        ok = sum(1 for l in sys.stdin if l.strip() and 'tags' in json.loads(l))
        print(ok)
        " 2>/dev/null || echo 0)
        if [ "$TAGGED" -lt 5 ]; then
          echo "❌ tags field missing on sampled records ($TAGGED/5 have it)"
          PASS=false
        else
          echo "✅ tags field present on sampled records"
        fi

        # 3. source field present on records
        SOURCED=$(head -5 .github/data/all_jobs.json | python3 -c "
        import sys, json
        ok = sum(1 for l in sys.stdin if l.strip() and json.loads(l).get('source'))
        print(ok)
        " 2>/dev/null || echo 0)
        if [ "$SOURCED" -lt 5 ]; then
          echo "❌ source field missing on sampled records ($SOURCED/5 have it)"
          PASS=false
        else
          echo "✅ source field present on sampled records"
        fi

        # 4. is_direct_apply field present on at least one JSearch record
        JSEARCH_WITH_FLAG=$(python3 -c "
        import json
        count = 0
        with open('.github/data/all_jobs.json') as f:
          for line in f:
            line = line.strip()
            if not line: continue
            j = json.loads(line)
            if j.get('source') == 'jsearch' and 'is_direct_apply' in j:
              count += 1
              if count >= 1: break
        print(count)
        " 2>/dev/null || echo 0)
        if [ "$JSEARCH_WITH_FLAG" -lt 1 ]; then
          echo "⚠️  is_direct_apply field not yet on JSearch records (may appear after TTL refresh)"
        else
          echo "✅ is_direct_apply present on JSearch records"
        fi

        # 5. jobs-metadata.json has freshness and top_companies (new fields from df7e6a4)
        if [ -f ".github/data/jobs-metadata.json" ]; then
          HAS_FRESHNESS=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        print(1 if 'freshness' in m and 'top_companies' in m else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_FRESHNESS" -eq 1 ]; then
            echo "✅ jobs-metadata.json has freshness + top_companies fields"
          else
            echo "❌ jobs-metadata.json missing freshness or top_companies fields"
            PASS=false
          fi

          # AGG-MEASURE-1: rollout projection is an AGG decision contract.
          # If this disappears, future level/source decisions silently fall back to stale prose.
          HAS_SENIOR_PROJECTION=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        p = m.get('senior_rollout_projection') or {}
        ok = (
            isinstance(p.get('sample_basis'), dict)
            and isinstance(p.get('by_source'), dict)
            and isinstance(p.get('by_domain'), dict)
            and isinstance(p.get('by_surface'), dict)
            and p.get('quality', {}).get('surface_projection_exact') is False
        )
        print(1 if ok else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_SENIOR_PROJECTION" -eq 1 ]; then
            echo "✅ jobs-metadata.json has senior_rollout_projection contract"
          else
            echo "::warning::jobs-metadata.json missing valid senior_rollout_projection contract"
            echo "⚠️  Advisory metadata missing; fresh job publish should continue"
          fi

          # AGG-SOURCE-1: source-tier visibility should stay producer-owned, not prose-only.
          HAS_SOURCE_VISIBILITY=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        s = m.get('source_visibility') or {}
        sources = s.get('sources') or {}
        required = {'workday', 'greenhouse', 'ashby'}
        ok = (
            s.get('policy_version') == 'source-tier-a141'
            and isinstance(sources, dict)
            and required.issubset(set(sources.keys()))
            and all(isinstance(sources[src].get('tech_us_jobs'), int) for src in required)
        )
        print(1 if ok else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_SOURCE_VISIBILITY" -eq 1 ]; then
            echo "✅ jobs-metadata.json has source_visibility contract"
          else
            echo "::warning::jobs-metadata.json missing valid source_visibility contract"
            echo "⚠️  Advisory metadata missing; fresh job publish should continue"
          fi

          HAS_LATENCY_MARKERS=$(python3 -c "
        import json
        m = json.load(open('.github/data/jobs-metadata.json'))
        lm = m.get('latency_markers') or {}
        steps = lm.get('step_timings_ms') or {}
        ok = (
            isinstance(lm.get('pipeline_started_at'), str)
            and isinstance(lm.get('output_ready_at'), str)
            and isinstance(steps.get('step1_fetch_ms'), int)
            and isinstance(steps.get('step8b_sidecars_ms'), int)
            and isinstance(steps.get('step9_write_ms'), int)
        )
        print(1 if ok else 0)
        " 2>/dev/null || echo 0)
          if [ "$HAS_LATENCY_MARKERS" -eq 1 ]; then
            echo "✅ jobs-metadata.json has latency_markers contract"
          else
            echo "::warning::jobs-metadata.json missing valid latency_markers contract"
            echo "⚠️  Advisory metadata missing; fresh job publish should continue"
          fi
        fi

        # AGG-PIPE-8: File-existence checks for critical submodule files.
        # Origin: d06bb81 deleted tag-engine.js, pipeline produced corrupt output for 7h.

        # 6. tag-engine.js exists and exports expected functions
        TAG_ENGINE_PATH=".github/scripts/aggregator/lib/processors/tag-engine.js"
        if [ ! -f "$TAG_ENGINE_PATH" ]; then
          echo "❌ tag-engine.js MISSING — pipeline will produce corrupt output"
          PASS=false
        else
          TAG_LINE_COUNT=$(wc -l < "$TAG_ENGINE_PATH")
          if [ "$TAG_LINE_COUNT" -lt 100 ]; then
            echo "❌ tag-engine.js: $TAG_LINE_COUNT lines (expected >3000) — likely truncated"
            PASS=false
          else
            echo "✅ tag-engine.js: $TAG_LINE_COUNT lines"
          fi
        fi

        # 7. company-list.json is parseable with expected platforms
        CL_PATH=".github/scripts/aggregator/lib/fetchers/company-list.json"
        if [ ! -f "$CL_PATH" ]; then
          echo "❌ company-list.json MISSING — fetchers have no tenant list"
          PASS=false
        else
          CL_PLATFORMS=$(python3 -c "
        import json
        cl = json.load(open('$CL_PATH'))
        platforms = set(cl.keys())
        required = {'greenhouse', 'lever', 'ashby', 'workday', 'smartrecruiters'}
        missing = required - platforms
        print('MISSING:' + ','.join(missing) if missing else 'OK')
        " 2>/dev/null || echo "MISSING:parse-error")
          if [[ "$CL_PLATFORMS" == MISSING:* ]]; then
            echo "❌ company-list.json missing platforms: ${CL_PLATFORMS#MISSING:}"
            PASS=false
          else
            echo "✅ company-list.json has all required platforms"
          fi
        fi

        # 8. deduplicator.js exports DEDUPE_TTL constants
        DEDUP_PATH=".github/scripts/aggregator/lib/processors/deduplicator.js"
        if [ ! -f "$DEDUP_PATH" ]; then
          echo "❌ deduplicator.js MISSING — pipeline cannot deduplicate"
          PASS=false
        else
          HAS_TTL=$(grep -c "DEDUPE_TTL_DAYS" "$DEDUP_PATH" || echo 0)
          if [ "$HAS_TTL" -lt 1 ]; then
            echo "❌ deduplicator.js missing DEDUPE_TTL_DAYS export"
            PASS=false
          else
            echo "✅ deduplicator.js exports DEDUPE_TTL_DAYS"
          fi
        fi

        if [ "$PASS" = "true" ]; then
          echo "✅ All invariant checks passed"
        else
          echo "❌ One or more invariant checks failed — see above"
          exit 1
        fi


    - name: "Contract conformance check on the published pool (AGG-PROOF-CONFORMANCE-1, non-blocking)"
      if: success()
      continue-on-error: true
      run: |
        python3 -m pip install --quiet --disable-pip-version-check boto3
        bash .github/scripts/agg-conformance-check.sh
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Mark sidecar generation in progress — upload phase only (AGG-FETCHJOBS-MARKER-WINDOW-1)"
      run: |
        TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        MARKER='{"status":"in_progress","run_id":"'"${GITHUB_RUN_ID}"'","started_at":"'"${TS}"'","updated_at":"'"${TS}"'"}'
        printf '%s' "$MARKER" > /tmp/fetch-jobs-sidecar-complete.json
        # AGG-MARKER-STORAGE-RETRY-1: R2 marker FIRST and fatal — R2 is canonical and the
        # ONLY reader path (ENR agg-snapshot-gate reads R2). Storage is a backup copy with
        # zero marker readers: bounded retry, non-fatal, so a Supabase relapse can no longer
        # fail the run (observed 3x 2026-08-28: exit-22 marker-only failures while the
        # canonical R2 publish had already succeeded) nor skip the R2 marker ENR waits on.
        node <<'EOF'
        const fs = require('fs');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const marker = fs.readFileSync('/tmp/fetch-jobs-sidecar-complete.json');
          const r2 = createR2Client({ prefix: 'data/' });
          const ok = await r2.uploadRaw('fetch-jobs-sidecar-complete.json', marker, 'application/json');
          if (!ok) throw new Error('R2 marker upload returned false');
        }
        main().catch(err => { console.error(err.message); process.exit(1); });
        EOF
        curl -sf --retry 3 --retry-delay 15 --retry-all-errors -X PUT \
          "${SUPABASE_URL}/storage/v1/object/pipeline-data/fetch-jobs-sidecar-complete.json" \
          -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/fetch-jobs-sidecar-complete.json \
          || echo "⚠️ Storage marker backup failed (non-fatal — R2 canonical marker written; AGG-MARKER-STORAGE-RETRY-1)"
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Flip sidecar marker to failed on cancellation (AGG-DESCBACKFILL-CANCELRACE-1)"
      if: cancelled()
      run: |
        # A CANCELLED run can be killed before the if:always() completion write lands,
        # leaving the marker at in_progress forever (C248 zombie class - the gate burns
        # its wait caps polling it). This runs ONLY on cancellation and flips OUR OWN
        # in_progress marker to failed (double guard: run_id match AND status still
        # in_progress - never touches a successor's marker, never downgrades a completed
        # run). The gate fails fast on status=failed; the next run's marker restores it.
        # Mirrors the production-proven desc-backfill.yml flip (landed 2026-09-14).
        node <<'EOF'
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const current = await r2.downloadJson('fetch-jobs-sidecar-complete.json');
          if (!current || current.status !== 'in_progress') {
            console.log('Marker status ' + (current ? current.status : 'missing') + ' - nothing to clean up');
            return;
          }
          if (String(current.run_id) !== String(process.env.GITHUB_RUN_ID)) {
            console.log('Marker run_id ' + current.run_id + ' != ' + process.env.GITHUB_RUN_ID + ' - a newer run owns it; not touching');
            return;
          }
          const marker = JSON.stringify({ status: 'failed', run_id: process.env.GITHUB_RUN_ID, started_at: current.started_at || null, note: 'run cancelled mid-flight (AGG-DESCBACKFILL-CANCELRACE-1)' });
          const ok = await r2.uploadRaw('fetch-jobs-sidecar-complete.json', marker, 'application/json');
          console.log(ok ? 'Marker flipped to failed (cancelled run, run_id guarded)' : 'R2 marker upload returned false (non-fatal)');
        }
        main().catch(err => { console.error('cleanup failed (non-fatal): ' + err.message); });
        EOF
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Upload pipeline data to Supabase Storage"
      id: upload_pipeline_data
      if: success()
      continue-on-error: true
      run: node .github/scripts/upload-to-storage.js --bucket pipeline-data --data-dir .github/data
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: "Write main-pipeline sidecar marker (AGG-DESCBACKFILL-MARKER-1)"
      if: always()
      run: |
        STATUS=complete
        if [ "${{ steps.upload_pipeline_data.outcome }}" != "success" ]; then STATUS=failed; fi
        ORACLE_LINES=$(wc -l < .github/data/descriptions-oracle.jsonl 2>/dev/null || echo 0)
        COMPLETED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        # AGG-MARKER-STORAGE-RETRY-1: R2 first (fatal, only reader path) — Storage backup
        echo "{\"sidecars_written_at\":\"${COMPLETED_AT}\",\"oracle_entries\":${ORACLE_LINES},\"status\":\"${STATUS}\",\"run_id\":\"${GITHUB_RUN_ID}\",\"updated_at\":\"${COMPLETED_AT}\"}" > /tmp/fetch-jobs-sidecar-complete.json
        node <<'EOF'
        const fs = require('fs');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const marker = fs.readFileSync('/tmp/fetch-jobs-sidecar-complete.json');
          const r2 = createR2Client({ prefix: 'data/' });
          const ok = await r2.uploadRaw('fetch-jobs-sidecar-complete.json', marker, 'application/json');
          if (!ok) throw new Error('R2 marker upload returned false');
        }
        main().catch(err => { console.error(err.message); process.exit(1); });
        EOF
        curl -sf --retry 3 --retry-delay 15 --retry-all-errors -X PUT \
          "${SUPABASE_URL}/storage/v1/object/pipeline-data/fetch-jobs-sidecar-complete.json" \
          -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/fetch-jobs-sidecar-complete.json \
          || echo "⚠️ Storage marker backup failed (non-fatal — R2 canonical marker written; AGG-MARKER-STORAGE-RETRY-1)"
        echo "Marker: ${STATUS} at ${COMPLETED_AT} (${ORACLE_LINES} Oracle entries)"
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}


    - name: Log total workflow time
      if: always()
      run: |
        START=$(cat .github/data/workflow-start.txt 2>/dev/null || echo 0)
        NOW=$(date -u +%s)
        ELAPSED=$((NOW - START))
        MIN=$((ELAPSED / 60))
        SEC=$((ELAPSED % 60))
        echo "⏱️ Total workflow time: ${ELAPSED}s (${MIN}min ${SEC}s)"
        echo "WORKFLOW_TOTAL_SECONDS=${ELAPSED}" >> $GITHUB_ENV

 
    - name: Trigger enrichment (wave link — eliminates avg 7.5min enrich wait)
      if: success() && github.ref_name == 'main'
      run: |
        curl -sf -X POST "https://api.github.com/repos/zapplyjobs/jobs-data-2026/actions/workflows/enrich-jobs.yml/dispatches" \
          -H "Authorization: Bearer ${GH_PAT}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -d '{"ref":"main"}' \
          && echo "✅ Triggered enrichment (wave link)" \
          || echo "⚠️ Enrichment dispatch failed (non-blocking — Worker cron will catch up)"
      env:
        GH_PAT: ${{ secrets.GH_PAT }}

    # Consumer README push REMOVED from fetch-jobs — moved to push-consumer-readmes.yml,
    # wave-linked from jobs-data-2026/enrich-jobs.yml AFTER enrichment completes
    # (INF-CONSUMER-PUSH-ENRICH-RACE-1). Fetching here used PREVIOUS-cycle enriched_jobs
    # (enrich takes ~5min, this ran seconds after dispatching it) -> consumers got stale
    # visa/skills. board-counts upload moved with it. Monitoring: check-03 (consumer-failed)
    # alerts if the post-enrich push misses + consumer repos go stale.


    # AGG-REDUNDANT-COLLECTMETRICS-DISPATCH-2: collect-metrics dispatch REMOVED here —
    # it fired while enrich/board-counts were still mid-flight and snapshotted intermediate
    # state. The correct dispatch lives in push-consumer-readmes.yml (post board-counts
    # upload, freshness-gated); collect-metrics also retains its own push trigger.


    - name: Trigger Discord post (wave link — post current-cycle jobs, no 15-min lag)
      if: success() && github.ref_name == 'main'
      run: |
        curl -sf -X POST "https://api.github.com/repos/zapplyjobs/jobs-data-2026/actions/workflows/post-to-discord.yml/dispatches" \
          -H "Authorization: Bearer ${GH_PAT}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -d '{"ref":"main"}' \
          && echo "✅ Triggered Discord post (wave link)" \
          || echo "⚠️ Discord post dispatch failed (non-blocking — Worker cron will catch up)"
      env:
        GH_PAT: ${{ secrets.GH_PAT }}

    - name: Display logs (always run)
      if: always()
      run: |
        echo "📋 Fetch Output (last 50 lines):"
        tail -50 .github/logs/fetch.log || echo "Log file not found"

    - name: Upload fetch log on failure or cancellation (INF-1007 B1)
      if: failure() || cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: fetch-log-postmortem
        path: .github/logs/fetch.log
        retention-days: 14
        if-no-files-found: ignore

    - name: Verify output files
      if: always()
      run: |
        echo "📊 Output Files:"
        ls -lh .github/data/all_jobs.json || echo "all_jobs.json not found"
        ls -lh .github/data/jobs-metadata.json || echo "jobs-metadata.json not found"
        ls -lh .github/data/dedupe-store.json || echo "dedupe-store.json not found"

    - name: Display job counts
      if: always()
      run: |
        if [ -f ".github/data/jobs-metadata.json" ]; then
          echo "📊 Job Statistics:"
          cat .github/data/jobs-metadata.json | jq '{
            total_jobs,
            unique_jobs,
            duplicates_removed,
            by_job_type,
            jsearch_stats
          }'
        fi

    - name: Upload archive to R2 (forward-only; jobs-archive-private git repo frozen)
      if: success()
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        ARCHIVE_DIR=".github/data/archive"
        if [ ! -d "$ARCHIVE_DIR" ] || [ -z "$(ls -A $ARCHIVE_DIR 2>/dev/null)" ]; then
          echo "ℹ️ No archive files to upload"
          exit 0
        fi
        # INF-REPO-CONTENT-GATE-1 rider (operator-approved forward-only switch, 2026-08-26):
        # new weekly archives go to R2 data/archives/ (R2 is the designed home for bulk data,
        # free egress); the 1.2GB git repo is FROZEN as the historical record (no rewrite).
        # Readers: projects/zjp/scripts/archive-analysis.sh reads R2-first for new weeks.
        node -e "
        const fs = require('fs');
        const path = require('path');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        (async () => {
          const r2 = createR2Client({ prefix: 'data/archives/' });
          const files = fs.readdirSync(process.argv[1]).filter(f => f.endsWith('.jsonl'));
          for (const f of files) {
            const body = fs.readFileSync(path.join(process.argv[1], f));
            await r2.uploadRaw(f, body, 'application/x-ndjson');
            console.log('ARCHIVED_R2:' + f + ' (' + body.length + 'B)');
          }
          console.log('archive upload complete: ' + files.length + ' file(s)');
        })().catch(e => { console.error('archive upload failed: ' + e.message); process.exit(1); });
        " "$ARCHIVE_DIR"

    - name: Freshness SLA alert
      if: always()
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
        CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
      run: |
        STATUS=".github/data/freshness-status.json"
        if [ ! -f "$STATUS" ]; then exit 0; fi
        BREACHED=$(node -e "try{const d=require('./'+process.argv[1]);console.log(d.breached?'true':'false')}catch{console.log('false')}" "$STATUS" 2>/dev/null || echo false)
        if [ "$BREACHED" != "true" ]; then exit 0; fi
        REASON=$(node -e "try{console.log(require('./'+process.argv[1]).reason||'breached')}catch{console.log('breached')}" "$STATUS" 2>/dev/null)
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        MSG="⚠️ **AGG Freshness SLA breached**\n${REASON}\n• Run: ${RUN_URL}\n• Time: ${TS}"
        PAYLOAD=$(printf '{"content":"%s"}' "$MSG")
        curl -sf -X POST "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" \
          -H "Authorization: Bot ${DISCORD_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" || echo "Freshness Discord alert failed (non-blocking)"

    - name: Notify on failure
      if: failure()
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
        CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
      run: |
        echo "❌ Workflow failed - check logs above"
        echo "Last 30 lines of fetch log:"
        tail -30 .github/logs/fetch.log || echo "No log file"

        # Send Discord alert (INF-ALERT-5)
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        DETAIL=""
        if [ -d ".github/scripts/aggregator" ]; then
          FC=$(find .github/scripts/aggregator -type f | wc -l)
          if [ "$FC" -lt 30 ]; then DETAIL="Aggregator submodule: only $FC files."; fi
          for f in company-list.json tag-engine.js workday.js; do
            if ! find .github/scripts/aggregator -name "$f" -type f -print -quit | grep -q .; then
              DETAIL="${DETAIL} Missing: $f."
            fi
          done
        else
          DETAIL="Aggregator submodule directory MISSING."
        fi
        MSG="🚨 **Pipeline Failure**\n${DETAIL:-Check logs.}\n• Run: ${RUN_URL}\n• Time: ${TS}"
        PAYLOAD=$(printf '{"content":"%s"}' "$MSG")
        curl -sf -X POST "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" \
          -H "Authorization: Bot ${DISCORD_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" || echo "Discord alert failed (non-blocking)"

    # Heartbeat moved earlier (after R2 upload) to reduce cycle time (AGG-RUNTIME-ALERT-1)
    # READMEs + archive now run after the heartbeat — they don't block the next run.
