name: Push Consumer READMEs

# push still runs as a fallback; Phase 2 removes it once this is verified.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [push-consumer-readmes]

concurrency:
  group: push-consumer-readmes
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 1
        submodules: recursive
        token: ${{ secrets.GH_PAT }}

    - name: Install transcrypt
      run: |
        curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
        chmod +x /tmp/transcrypt
        sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

    - name: Unlock encrypted files
      run: |
        echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
        git checkout -- .
        git submodule foreach --recursive '
          echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
          rm -f "$(git rev-parse --gitdir)/index" 2>/dev/null || true
          git checkout HEAD -- . 2>/dev/null || true
        ' || true
      env:
        TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

    - name: Fix submodule index
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create data directory
      run: mkdir -p .github/data

    - name: Check enriched_jobs freshness
      id: freshness
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        node -e "
        const fs = require('fs');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        const MAX_AGE_MINUTES = 20;
        const setOutput = value => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'fresh=' + value + '\n');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          const metadata = await r2.head('enriched_jobs.json');
          if (!metadata?.lastModified) {
            console.log('⚠️ SKIP: enriched_jobs.json freshness unavailable — fail closed');
            setOutput(false);
            return;
          }
          const ageMinutes = (Date.now() - new Date(metadata.lastModified).getTime()) / 60000;
          if (!Number.isFinite(ageMinutes) || ageMinutes > MAX_AGE_MINUTES) {
            console.log('⚠️ SKIP: enriched_jobs.json is ' + Math.round(ageMinutes) + ' minutes old (limit ' + MAX_AGE_MINUTES + ')');
            setOutput(false);
            return;
          }
          console.log('✅ enriched_jobs.json is ' + Math.round(ageMinutes) + ' minutes old (limit ' + MAX_AGE_MINUTES + ')');
          setOutput(true);
        }
        main().catch(error => {
          console.error('⚠️ SKIP: enriched_jobs.json freshness check failed:', error.message);
          setOutput(false);
        });
        "

    - name: Download fresh all_jobs + enriched_jobs from R2
      if: success() && steps.freshness.outputs.fresh == 'true'
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        node -e "
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          const r2 = createR2Client({ prefix: 'data/' });
          await r2.downloadToFile('all_jobs.json', '.github/data/all_jobs.json');
          console.log('✅ Downloaded all_jobs.json');
          await r2.downloadToFile('enriched_jobs.json', '.github/data/enriched_jobs.json');
          console.log('✅ Downloaded enriched_jobs.json (fresh, post-enrichment)');
          // Feed files (feedKey) derived from the aggregator configs index at the PINNED
          // submodule commit (INF-PUBLISHER-FEEDLIST-1): a new board with a feedKey is
          // downloaded automatically, closing the silent-skip class (Feed not found
          // locally: board skipped, run green). A missing EXISTING feed stays LOUD:
          // all derived feeds are attempted, then the step fails listing every miss.
          const idx = JSON.parse(require('fs').readFileSync('./.github/scripts/aggregator/configs/_index.json', 'utf8'));
          const feeds = [...new Set(idx.map(b => b.feedKey).filter(k => k && k !== 'N/A'))];
          console.log('Derived feed list (' + feeds.length + '): ' + feeds.join(', '));
          const missed = [];
          for (const feed of feeds) {
            try { await r2.downloadToFile(feed, '.github/data/' + feed); console.log('✅ Downloaded ' + feed); }
            catch (e) { missed.push(feed + ' (' + e.message + ')'); }
          }
          if (missed.length) { console.error('❌ Feed download failed: ' + missed.join('; ')); process.exit(1); }
          // Canada LMIA visa markers (OUT-CAVISA-SURFACING-1) — id-keyed from ENR's lane
          try { await r2.downloadToFile('canada-jobs-enriched.json', '.github/data/canada-jobs-enriched.json'); console.log('✅ Downloaded canada-jobs-enriched.json'); }
          catch (e) { console.log('ℹ️ canada-jobs-enriched.json not on R2 yet — Canada visa column renders blank'); }
          // Company visa-posture priors (OUT-POSTURE-ARTIFACT-AVAILABLE-1) — slug-keyed
          // SUP artifact; loader degrades to no-posture when missing/unreadable/stale
          try { await r2.downloadToFile('sup-company-posture.json', '.github/data/sup-company-posture.json'); console.log('✅ Downloaded sup-company-posture.json'); }
          catch (e) { console.log('ℹ️ sup-company-posture.json not on R2 — READMEs render without posture tiers'); }
          // OUT-TIER2-BOARDCONCENTRATION-1: SUP Tier-2 employer shelf list (classification authority)
          try { await r2.downloadToFile('sup_tier2_employers.json', '.github/data/sup_tier2_employers.json'); console.log('✅ Downloaded sup_tier2_employers.json'); }
          catch (e) { console.log('ℹ️ sup_tier2_employers.json not on R2 — Tier-2 filters fail open (retail board empty, broad boards unfiltered)'); }
        }
        main().catch(e => { console.error('❌ R2 download failed:', e.message); process.exit(1); });
        "

    - name: Generate + push consumer board READMEs
      if: success() && steps.freshness.outputs.fresh == 'true'
      continue-on-error: true
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        GH_TOKEN: ${{ secrets.GH_PAT }}
        DISCORD_TEAM_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
        DISCORD_PIPELINE_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
        # R2 for the dead-list consults (dead ids + ats-closed URLs) read FRESH at
        # generation. Absent until 2026-08-19: the consumer's isR2Configured gate
        # (then keyed on SUPABASE_URL) silently disabled BOTH hides in this step.
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        cd .github/scripts/consumer && npm install --silent
        cd $GITHUB_WORKSPACE
        node .github/scripts/generate-and-push-readmes.js

    - name: Upload fresh board-counts.json to Storage
      if: success() && steps.freshness.outputs.fresh == 'true'
      continue-on-error: true
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        curl -sf -X PUT \
          -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "Content-Type: application/json" \
          --data-binary @.github/data/board-counts.json \
          "${SUPABASE_URL}/storage/v1/object/pipeline-data/board-counts.json" \
          && echo "✅ Uploaded fresh board-counts.json" \
          || echo "⚠️ board-counts.json upload failed (non-critical)"

    - name: Upload fresh board-counts.json to R2
      if: success() && steps.freshness.outputs.fresh == 'true'
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        node -e "
        const fs = require('fs');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          if (!fs.existsSync('.github/data/board-counts.json')) { console.log('board-counts.json not found — skipping R2 upload'); return; }
          const r2 = createR2Client({ prefix: 'data/' });
          const data = JSON.parse(fs.readFileSync('.github/data/board-counts.json', 'utf8'));
          await r2.uploadJson('board-counts.json', data);
          console.log('✅ Uploaded board-counts.json to R2');
        }
        main().catch(e => { console.error('⚠️ board-counts.json R2 upload failed:', e.message); });
        "

    - name: Upload fresh output-funnel.json to Storage
      if: success() && steps.freshness.outputs.fresh == 'true'
      continue-on-error: true
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        curl -sf -X PUT \
          -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "Content-Type: application/json" \
          --data-binary @.github/data/output-funnel.json \
          "${SUPABASE_URL}/storage/v1/object/pipeline-data/output-funnel.json" \
          && echo "✅ Uploaded fresh output-funnel.json" \
          || echo "⚠️ output-funnel.json upload failed (non-critical)"

    - name: Upload fresh output-funnel.json to R2
      if: success() && steps.freshness.outputs.fresh == 'true'
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        node -e "
        const fs = require('fs');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          if (!fs.existsSync('.github/data/output-funnel.json')) { console.log('output-funnel.json not found — skipping R2 upload'); return; }
          const r2 = createR2Client({ prefix: 'data/' });
          const data = JSON.parse(fs.readFileSync('.github/data/output-funnel.json', 'utf8'));
          await r2.uploadJson('output-funnel.json', data);
          console.log('✅ Uploaded output-funnel.json to R2');
        }
        main().catch(e => { console.error('⚠️ output-funnel.json R2 upload failed:', e.message); });
        "

    - name: Upload fresh publish-status.json to Storage
      if: success() && steps.freshness.outputs.fresh == 'true'
      continue-on-error: true
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        curl -sf -X PUT \
          -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
          -H "Content-Type: application/json" \
          --data-binary @.github/data/publish-status.json \
          "${SUPABASE_URL}/storage/v1/object/pipeline-data/publish-status.json" \
          && echo "✅ Uploaded fresh publish-status.json" \
          || echo "⚠️ publish-status.json upload failed (non-critical)"

    - name: Upload fresh publish-status.json to R2
      if: success() && steps.freshness.outputs.fresh == 'true'
      continue-on-error: true
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        node -e "
        const fs = require('fs');
        const { createR2Client } = require('./.github/scripts/aggregator/lib/storage/r2-client');
        async function main() {
          if (!fs.existsSync('.github/data/publish-status.json')) { console.log('publish-status.json not found — skipping R2 upload'); return; }
          const r2 = createR2Client({ prefix: 'data/' });
          const data = JSON.parse(fs.readFileSync('.github/data/publish-status.json', 'utf8'));
          await r2.uploadJson('publish-status.json', data);
          console.log('✅ Uploaded publish-status.json to R2');
        }
        main().catch(e => { console.error('⚠️ publish-status.json R2 upload failed:', e.message); });
        "

    - name: Trigger collect-metrics (wave link — fresh board-counts in zjp-metrics)
      if: success() && steps.freshness.outputs.fresh == 'true' && github.ref_name == 'main'
      run: |
        curl -sf -X POST "https://api.github.com/repos/zapplyjobs/jobs-data-2026/actions/workflows/collect-metrics.yml/dispatches" \
          -H "Authorization: Bearer ${GH_PAT}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -d '{"ref":"main"}' \
          && echo "✅ Triggered collect-metrics (post board-counts upload — INF-BOARDCOUNTS-STALE-IN-METRICS-1)" \
          || echo "⚠️ collect-metrics dispatch failed (non-critical)"
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
