# BrassRing GA+BAE pilot lane (PIPE-20 step 3/4; rev2 design packet, 2026-11-16).
#
# Trigger policy (AGG-WORKFLOW-DISPATCH-AUDIT-1): this file carries TWO triggers,
# both with intent commented:
#   1. workflow_dispatch — the production-facing manual/operator entry (option 4,
#      acceptable for manual tools with this comment). NOTE: until this file lands
#      on the default branch, `gh workflow run` CANNOT resolve it (workflow IDs
#      resolve from the default branch), so the branch-scoped proof run uses the
#      push trigger below.
#   2. push (this branch, this file only) — the branch-scoped PROOF vehicle
#      (option 3, code-change-triggered): pushing the pilot branch fires exactly
#      one run of the pilot lane at the branch ref. Production cadence (schedule /
#      wave-link per the policy) is deliberately NOT wired until the Adversary
#      diff verdict passes the merge gate. Do NOT add a cron or a dispatcher
#      rider here, and do NOT read the push trigger as a cadence.
#
# Pool boundary: this lane writes brassring-pilot-* R2 artifacts only. It is NOT
# registered in index.js supplementalInputs — nothing in this run can touch
# all_jobs.json (lane isolation; pool impact bounded by design).
name: BrassRing Pilot Lane

on:
  workflow_dispatch:
  push:
    branches:
      - 'agg/brassring-pilot-consumer'
    paths:
      - '.github/workflows/fetch-brassring-pilot.yml'

concurrency:
  group: fetch-brassring-pilot
  cancel-in-progress: false

jobs:
  fetch-brassring-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Per-source budget caps (Product Logic Gate posture; defaults in the driver,
      # overridable here without a code change).
      BRASSRING_TENANT_BUDGET: '220'
      BRASSRING_MAX_PAGES_PER_PASS: '120'
      BRASSRING_PACING_MS: '1000'
      BRASSRING_MAX_RETRIES: '3'
      BRASSRING_TIMEOUT_MS: '30000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      # MANDATORY: both repos encrypt *.js/*.json at rest (gitattributes crypt
      # filter) — without the unlock, checkout serves ciphertext and node dies
      # with SyntaxError at line 1 (run 43997594250 failure basis). Mirrors the
      # lane-workflow unlock shape (fetch-supplemental-6.yml): root + every
      # submodule (the brassring fetcher lives in the aggregator submodule).
      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory
        run: mkdir -p .github/data

      - name: Fetch BrassRing pilot boards
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node .github/scripts/fetch-brassring-pilot.js
