name: Cleanup Stale Runs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # INF-CRON-CLEANUP: reduced from */5 (was consuming ~8,640 min/month on private repo, 2.8x the 3,000 included budget). Hourly is sufficient — stale runs are cosmetic, STALE_MINUTES=45 means the cleanup window is still tight.

permissions: {}


jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Cancel stale workflow runs
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        node -e "
        const https = require('https');

        const REPOS = [
          'zapplyjobs/jobs-aggregator-engine',
          'zapplyjobs/jobs-data-2026',
          'zapplyjobs/New-Grad-Jobs-2027',
          'zapplyjobs/Internships-2027',
          'zapplyjobs/New-Grad-Software-Engineering-Jobs-2027',
          'zapplyjobs/New-Grad-Data-Science-Jobs-2027',
          'zapplyjobs/New-Grad-Hardware-Engineering-Jobs-2027',
          'zapplyjobs/New-Grad-Healthcare-Jobs-2027',
        ];

        const STALE_MINUTES = 45;
        // INF-QUEUED-ZOMBIE-RESIDUAL-1 (2026-08-25): protected workflows get a LONGER
        // threshold (6h = 10x any legitimate queue wait) instead of blanket immunity.
        const PROTECTED_STALE_MINUTES = 360;
        const PROTECTED_WORKFLOWS = new Set(['Fetch All Jobs', 'Enrich Jobs']);

        function apiFetch(path) {
          return new Promise((resolve, reject) => {
            const opts = {
              hostname: 'api.github.com',
              path: path,
              headers: {
                'Authorization': 'token ' + process.env.GH_PAT,
                'User-Agent': 'ZJP-Stale-Cleanup',
              },
            };
            https.get(opts, res => {
              let data = '';
              res.on('data', c => data += c);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); }
                catch(e) { reject(new Error('Parse error: ' + res.statusCode)); }
              });
            }).on('error', reject);
          });
        }

        function apiCall(method, path) {
          return new Promise((resolve) => {
            const opts = {
              hostname: 'api.github.com',
              path: path,
              method: method,
              headers: {
                'Authorization': 'token ' + process.env.GH_PAT,
                'User-Agent': 'ZJP-Stale-Cleanup',
              },
            };
            const req = https.request(opts, res => {
              let data = '';
              res.on('data', c => data += c);
              res.on('end', () => resolve(res.statusCode));
            });
            req.on('error', () => resolve(0));
            req.end();
          });
        }

        async function cancelRun(repo, runId) {
          const code = await apiCall('POST', '/repos/' + repo + '/actions/runs/' + runId + '/cancel');
          if (code === 500 || code === 403 || code === 409) {
            // Zombie entries: cancel returns 500 (uncancellable), 403/409 (stuck state).
            // Delete is the remedy for the backlog class. (403 added 2026-08-25 after
            // the first drain run showed 7-day-old queued runs failing cancel with 403.)
            const delCode = await apiCall('DELETE', '/repos/' + repo + '/actions/runs/' + runId);
            return delCode === 204 ? 'deleted' : 'failed:' + delCode;
          }
          return code;
        }

        async function main() {
          let cancelled = 0;
          for (const repo of REPOS) {
            for (const status of ['in_progress', 'queued']) {
              try {
                const result = await apiFetch('/repos/' + repo + '/actions/runs?status=' + status + '&per_page=10');
                const runs = result.workflow_runs || [];
                for (const run of runs) {
                  const created = new Date(run.created_at).getTime();
                  const ageMinutes = Math.round((Date.now() - created) / 60000);
                  const thresholdMin = PROTECTED_WORKFLOWS.has(run.name) ? PROTECTED_STALE_MINUTES : STALE_MINUTES;
                  if (created < Date.now() - thresholdMin * 60 * 1000) {
                    const code = await cancelRun(repo, run.id);
                    const tag = PROTECTED_WORKFLOWS.has(run.name) ? 'STALE-PROTECTED' : 'STALE';
                    const ok = code === 202 || code === 'deleted';
                    console.log(tag + ': ' + repo + ' run #' + run.id + ' (' + run.name + ') ' + ageMinutes + ' min old — cancel: ' + code);
                    if (ok) cancelled++; else console.log('  WARN: not counted (failed to clear run ' + run.id + ')');
                  }
                }
              } catch(e) {
                console.error('Error checking ' + repo + ': ' + e.message);
              }
            }
          }
          console.log('Cleanup complete: ' + cancelled + ' stale runs cancelled');
          if (cancelled > 0) {
            console.log('::warning::' + cancelled + ' stale run(s) cancelled');
          }
        }

        main().catch(e => { console.error(e); process.exit(1); });
        "
