name: Cleanup Stale Runs

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions: {}


jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Cancel stale workflow runs
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        node -e "
        const https = require('https');

        const REPOS = [
          'zapplyjobs/jobs-aggregator-private',
          'zapplyjobs/jobs-data-2026',
          'zapplyjobs/New-Grad-Jobs-2027',
          'zapplyjobs/Internships-2027',
          'zapplyjobs/New-Grad-Software-Engineering-Jobs-2027',
          'zapplyjobs/New-Grad-Data-Science-Jobs-2027',
          'zapplyjobs/New-Grad-Hardware-Engineering-Jobs-2027',
          'zapplyjobs/New-Grad-Healthcare-Jobs-2027',
        ];

        const STALE_MINUTES = 45;
        const PROTECTED_WORKFLOWS = new Set(['Fetch All Jobs', 'Enrich Jobs']);
        const cutoff = Date.now() - STALE_MINUTES * 60 * 1000;

        function apiFetch(path) {
          return new Promise((resolve, reject) => {
            const opts = {
              hostname: 'api.github.com',
              path: path,
              headers: {
                'Authorization': 'token ' + process.env.GH_PAT,
                'User-Agent': 'ZJP-Stale-Cleanup',
              },
            };
            https.get(opts, res => {
              let data = '';
              res.on('data', c => data += c);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); }
                catch(e) { reject(new Error('Parse error: ' + res.statusCode)); }
              });
            }).on('error', reject);
          });
        }

        function apiCall(method, path) {
          return new Promise((resolve) => {
            const opts = {
              hostname: 'api.github.com',
              path: path,
              method: method,
              headers: {
                'Authorization': 'token ' + process.env.GH_PAT,
                'User-Agent': 'ZJP-Stale-Cleanup',
              },
            };
            const req = https.request(opts, res => {
              let data = '';
              res.on('data', c => data += c);
              res.on('end', () => resolve(res.statusCode));
            });
            req.on('error', () => resolve(0));
            req.end();
          });
        }

        async function cancelRun(repo, runId) {
          const code = await apiCall('POST', '/repos/' + repo + '/actions/runs/' + runId + '/cancel');
          if (code === 500) {
            // Zombie run — cancel API returns 500 for runs stuck in queued/in_progress
            // that GitHub can't actually cancel. Try deleting instead.
            const delCode = await apiCall('DELETE', '/repos/' + repo + '/actions/runs/' + runId);
            return delCode === 204 ? 'deleted' : 'failed:' + delCode;
          }
          return code;
        }

        async function main() {
          let cancelled = 0;
          for (const repo of REPOS) {
            for (const status of ['in_progress', 'queued']) {
              try {
                const result = await apiFetch('/repos/' + repo + '/actions/runs?status=' + status + '&per_page=10');
                const runs = result.workflow_runs || [];
                for (const run of runs) {
                  if (PROTECTED_WORKFLOWS.has(run.name)) {
                    console.log('SKIP: ' + repo + ' run #' + run.id + ' (' + run.name + ') — protected workflow');
                    continue;
                  }
                  const created = new Date(run.created_at).getTime();
                  const ageMinutes = Math.round((Date.now() - created) / 60000);
                  if (created < cutoff) {
                    const code = await cancelRun(repo, run.id);
                    console.log('STALE: ' + repo + ' run #' + run.id + ' (' + run.name + ') running ' + ageMinutes + ' min — cancel: ' + code);
                    cancelled++;
                  }
                }
              } catch(e) {
                console.error('Error checking ' + repo + ': ' + e.message);
              }
            }
          }
          console.log('Cleanup complete: ' + cancelled + ' stale runs cancelled');
          if (cancelled > 0) {
            console.log('::warning::' + cancelled + ' stale run(s) cancelled');
          }
        }

        main().catch(e => { console.error(e); process.exit(1); });
        "
