name: Bump Submodule

on:
  workflow_dispatch:
    inputs:
      submodule_name:
        description: 'Which submodule to bump'
        required: true
        type: choice
        options:
          - shared
          - aggregator
          - processing
          - consumer
      target_sha:
        description: 'SHA of the new submodule commit (short or full hex accepted)'
        required: true
        type: string

concurrency:
  group: bump-submodule
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  SUBMODULE_NAME: ${{ inputs.submodule_name }}
  TARGET_SHA: ${{ inputs.target_sha }}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: CDN propagation wait
        run: |
          echo "Waiting 120s for CDN propagation..."
          sleep 120

      - name: Validate inputs
        id: resolve-sha
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid SHA format: $TARGET_SHA (expected 7-40 char hex)"
            exit 1
          fi
          if [[ ${#TARGET_SHA} -lt 40 ]]; then
            declare -A SOURCE_REPOS=(
              ["shared"]="zapplyjobs/job-board-shared"
              ["aggregator"]="zapplyjobs/job-board-aggregator"
              ["processing"]="zapplyjobs/job-board-processing"
              ["consumer"]="zapplyjobs/job-board-consumer"
            )
            REPO="${SOURCE_REPOS[$SUBMODULE_NAME]}"
            FULL_SHA=$(gh api "repos/$REPO/commits/$TARGET_SHA" --jq '.sha' 2>/dev/null)
            if [[ -z "$FULL_SHA" || ${#FULL_SHA} -ne 40 ]]; then
              echo "::error::Short SHA $TARGET_SHA could not be resolved in $REPO"
              exit 1
            fi
            echo "::warning::Auto-resolved short SHA $TARGET_SHA -> $FULL_SHA"
            echo "TARGET_SHA=$FULL_SHA" >> "$GITHUB_ENV"
          fi
          echo "SHA resolved: ${TARGET_SHA:0:12}..."
          echo "Submodule: $SUBMODULE_NAME"

      - name: Resolve submodule config
        id: config
        run: |
          declare -A SOURCE_REPOS=(
            ["shared"]="zapplyjobs/job-board-shared"
            ["aggregator"]="zapplyjobs/job-board-aggregator"
            ["processing"]="zapplyjobs/job-board-processing"
            ["consumer"]="zapplyjobs/job-board-consumer"
          )

          SUBMODULE_PATH=".github/scripts/$SUBMODULE_NAME"
          echo "submodule_path=$SUBMODULE_PATH" >> "$GITHUB_OUTPUT"
          echo "source_repo=${SOURCE_REPOS[$SUBMODULE_NAME]}" >> "$GITHUB_OUTPUT"

          case "$SUBMODULE_NAME" in
            shared)
              echo "repos=zapplyjobs/jobs-aggregator-engine zapplyjobs/jobs-data-2026" >> "$GITHUB_OUTPUT"
              ;;
            aggregator)
              echo "repos=zapplyjobs/jobs-aggregator-engine" >> "$GITHUB_OUTPUT"
              ;;
            processing)
              echo "repos=zapplyjobs/jobs-data-2026" >> "$GITHUB_OUTPUT"
              ;;
            consumer)
              echo "repos=zapplyjobs/jobs-aggregator-engine" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown submodule: $SUBMODULE_NAME"
              exit 1
              ;;
          esac

      - name: Validate SHA exists in source repo
        run: |
          SOURCE_REPO="${{ steps.config.outputs.source_repo }}"
          RESPONSE=$(gh api "repos/$SOURCE_REPO/commits/$TARGET_SHA" --jq '.sha' 2>&1) || true
          if [[ "$RESPONSE" != "$TARGET_SHA" ]]; then
            echo "::error::SHA $TARGET_SHA does NOT exist in $SOURCE_REPO."
            echo "API response: $RESPONSE"
            exit 1
          fi
          echo "SHA existence verified: ${TARGET_SHA:0:12} on $SOURCE_REPO"

      - name: Freshness guard — fail loud on stale pins (AGG-AUTOBUMP-STALE-RACE-1)
        run: |
          SOURCE_REPO="${{ steps.config.outputs.source_repo }}"
          MAIN_SHA=$(gh api "repos/$SOURCE_REPO/commits/main" --jq '.sha')
          if [[ "$MAIN_SHA" != "$TARGET_SHA" ]]; then
            CMP=$(gh api "repos/$SOURCE_REPO/compare/$TARGET_SHA...$MAIN_SHA" --jq '.status')
            if [[ "$CMP" == "ahead" || "$CMP" == "diverged" ]]; then
              echo "::error::STALE PIN GUARD: TARGET_SHA ${TARGET_SHA:0:12} is behind/diverged from $SOURCE_REPO main (${MAIN_SHA:0:12}). A newer commit landed between dispatch and commit-time; pinning it would stale-pin the submodule (A274 race class). FAILING so the newer commit's own auto-bump pins the current SHA. Re-dispatch with the current main SHA only if pinning the older commit is intentional."
              exit 1
            fi
            echo "Freshness note: TARGET_SHA is not behind main (status=$CMP) — proceeding."
          else
            echo "Freshness OK: TARGET_SHA is current main of $SOURCE_REPO."
          fi

      - name: Disable dangerous workflows
        id: disable-workflows
        run: |
          gh api repos/zapplyjobs/jobs-aggregator-engine/actions/workflows/234555372/disable --method PUT --silent && echo "Disabled: aggregator/Fetch All Jobs" || echo "WARN: Could not disable"
          gh api repos/zapplyjobs/jobs-data-2026/actions/workflows/239692001/disable --method PUT --silent && echo "Disabled: jobs-data/Enrich Jobs" || echo "WARN: Could not disable"
          # Consumer repos are pure display (Phase 4) — no workflows to disable

      - name: Re-verify freshness at commit time (AGG-JOBSDATA-PIN-RACE-1)
        run: |
          # The early guard ran minutes ago (CDN wait, validation, disable steps).
          # A child landing in that window makes TARGET_SHA stale RIGHT before we pin.
          # Re-check here, seconds before the commit; failing loud lets the newer
          # landing's own auto-bump pin the current SHA.
          SOURCE_REPO="${{ steps.config.outputs.source_repo }}"
          MAIN_SHA=$(gh api "repos/$SOURCE_REPO/commits/main" --jq '.sha')
          if [[ "$MAIN_SHA" != "$TARGET_SHA" ]]; then
            CMP=$(gh api "repos/$SOURCE_REPO/compare/$TARGET_SHA...$MAIN_SHA" --jq '.status')
            if [[ "$CMP" == "ahead" || "$CMP" == "diverged" ]]; then
              echo "::error::COMMIT-TIME STALE PIN: TARGET_SHA ${TARGET_SHA:0:12} is behind/diverged from $SOURCE_REPO main (${MAIN_SHA:0:12}) — main moved during this run. FAILING so the newer landing's own auto-bump pins the current SHA."
              exit 1
            fi
          fi
          echo "Commit-time freshness OK: TARGET_SHA ${TARGET_SHA:0:12} still matches $SOURCE_REPO main."
      - name: Bump target repos
        id: bump
        run: |
          SUBMODULE_PATH="${{ steps.config.outputs.submodule_path }}"
          read -ra REPOS <<< "${{ steps.config.outputs.repos }}"
          SHORT_SHA="${TARGET_SHA:0:7}"
          PASS=0
          FAIL=0
          RESULTS=""

          echo "Bumping $SUBMODULE_NAME ($SUBMODULE_PATH) to ${TARGET_SHA:0:12} in ${#REPOS[@]} repo(s)"

          # Gated fallback for branch-protected main (e.g. jobs-aggregator-engine,
          # whose main requires the 'gate' status check). A direct git/refs/heads/main
          # PATCH is rejected while the required check is missing, so push a temp
          # branch (gate.yml triggers on push to any branch and runs on the bump
          # commit), wait for gate to pass, then fast-forward main (check now
          # satisfied) and delete the temp branch. Only used when direct update fails.
          gated_update() {
            local repo="$1" new_commit="$2"
            local branch="inf/bump-${SUBMODULE_NAME}-${GITHUB_RUN_ID}"
            local bref="refs/heads/$branch"
            local diag="/tmp/gated-diag-$SUBMODULE_NAME-$GITHUB_RUN_ID.log"
            local create_err
            if ! create_err=$(printf '{"ref":"%s","sha":"%s"}' "$bref" "$new_commit" \
                | gh api "repos/$repo/git/refs" --method POST --input - 2>&1); then
              echo "    gated: temp-branch create failed for $repo: $(echo "$create_err" | head -3)"
              return 1
            fi
            echo "    gated: pushed $branch -> waiting for required checks (gate + repo-guard)"
            local conclusion="" guard_conc="" waited=0
            while [ "$waited" -lt 900 ]; do
              conclusion=$(gh api "repos/$repo/actions/workflows/gate.yml/runs?branch=$branch&per_page=1" \
                           --jq '.workflow_runs[0].conclusion // empty' 2>>"$diag") || true
              guard_conc=$(gh api "repos/$repo/commits/$new_commit/check-runs?per_page=100" \
                           --jq '[.check_runs[] | select(.name == "guard")][0].conclusion // empty' 2>>"$diag") || true
              if [ -n "$conclusion" ] && [ -n "$guard_conc" ]; then break; fi
              sleep 20; waited=$((waited + 20))
            done
            if [ -z "$conclusion" ] || [ -z "$guard_conc" ]; then
              echo "    gated: check poll never returned gate+guard conclusions for $repo after ${waited}s (gate='${conclusion:-none}' guard='${guard_conc:-none}'); last poll errors: $(tail -3 "$diag" 2>/dev/null | tr '\n' ' ' | head -c 400)"
            fi
            if [ "$conclusion" != "success" ]; then
              echo "    gated: gate conclusion='${conclusion:-timeout}' (expected success); abandoning $repo"
              gh api "repos/$repo/git/refs/heads/$branch" --method DELETE --silent 2>/dev/null || true
              return 1
            fi
            if [ "$guard_conc" != "success" ]; then
              echo "    gated: guard conclusion='${guard_conc:-missing}' (expected success); abandoning $repo"
              gh api "repos/$repo/git/refs/heads/$branch" --method DELETE --silent 2>/dev/null || true
              return 1
            fi
            echo "    gated: gate + repo-guard green on $branch"
            local update patch_err
            update=$(printf '{"sha":"%s","force":false}' "$new_commit" \
                     | gh api "repos/$repo/git/refs/heads/main" --method PATCH --input - --jq '.object.sha' 2>/tmp/ff-diag-$SUBMODULE_NAME-$GITHUB_RUN_ID.log) || true
            if [ -n "$update" ]; then
              echo "    gated: main -> ${update:0:12}"
              gh api "repos/$repo/git/refs/heads/$branch" --method DELETE --silent 2>/dev/null || true
              echo "$update"; return 0
            fi
            echo "    gated: main fast-forward still rejected for $repo: $(head -3 /tmp/ff-diag-$SUBMODULE_NAME-$GITHUB_RUN_ID.log 2>/dev/null | tr '\n' ' ' | head -c 400)"
            gh api "repos/$repo/git/refs/heads/$branch" --method DELETE --silent 2>/dev/null || true
            return 1
          }

          for REPO in "${REPOS[@]}"; do
            REPO_NAME="${REPO#zapplyjobs/}"
            SUCCESS=false

            HEAD=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null) || { echo "  FAIL: $REPO_NAME (no main ref)"; RESULTS="${RESULTS}FAIL: ${REPO_NAME}\n"; FAIL=$((FAIL + 1)); continue; }
            TREE=$(gh api "repos/$REPO/git/commits/$HEAD" --jq '.tree.sha' 2>/dev/null) || { echo "  FAIL: $REPO_NAME (no tree)"; RESULTS="${RESULTS}FAIL: ${REPO_NAME}\n"; FAIL=$((FAIL + 1)); continue; }

            TREE_INPUT=$(printf '{"base_tree":"%s","tree":[{"path":"%s","mode":"160000","type":"commit","sha":"%s"}]}' "$TREE" "$SUBMODULE_PATH" "$TARGET_SHA")
            NEW_TREE=$(echo "$TREE_INPUT" | gh api "repos/$REPO/git/trees" --method POST --input - --jq '.sha' 2>/dev/null) || { echo "  FAIL: $REPO_NAME (tree create)"; RESULTS="${RESULTS}FAIL: ${REPO_NAME}\n"; FAIL=$((FAIL + 1)); continue; }

            COMMIT_INPUT=$(printf '{"message":"chore: bump %s to %s","tree":"%s","parents":["%s"]}' "$SUBMODULE_NAME" "$SHORT_SHA" "$NEW_TREE" "$HEAD")
            NEW_COMMIT=$(echo "$COMMIT_INPUT" | gh api "repos/$REPO/git/commits" --method POST --input - --jq '.sha' 2>/dev/null) || { echo "  FAIL: $REPO_NAME (commit create)"; RESULTS="${RESULTS}FAIL: ${REPO_NAME}\n"; FAIL=$((FAIL + 1)); continue; }

            # 1) direct ref update (works on unprotected repos; retry for transient races)
            for ATTEMPT in 1 2 3; do
              if UPDATE_RESULT=$(printf '{"sha":"%s","force":false}' "$NEW_COMMIT" \
                                 | gh api "repos/$REPO/git/refs/heads/main" --method PATCH --input - --jq '.object.sha' 2>/dev/null) \
                 && [ -n "$UPDATE_RESULT" ]; then
                echo "  PASS (direct): $REPO_NAME -> ${UPDATE_RESULT:0:12}"
                RESULTS="${RESULTS}PASS: ${REPO_NAME}\n"
                PASS=$((PASS + 1))
                SUCCESS=true
                break
              fi
              echo "  [$ATTEMPT/3] $REPO_NAME: direct ref-update failed, retrying..."
              sleep 5
            done

            # 2) gated fallback for branch-protected main
            if [ "$SUCCESS" = false ]; then
              echo "  $REPO_NAME: direct update rejected (branch-protected). Trying gated route..."
              if GATED_SHA=$(gated_update "$REPO" "$NEW_COMMIT"); then
                echo "  PASS (gated): $REPO_NAME -> ${GATED_SHA:0:12}"
                RESULTS="${RESULTS}PASS: ${REPO_NAME} (gated)\n"
                PASS=$((PASS + 1))
                SUCCESS=true
              fi
            fi

            if [ "$SUCCESS" = false ]; then
              echo "  FAIL: $REPO_NAME (direct + gated)"
              RESULTS="${RESULTS}FAIL: ${REPO_NAME}\n"
              FAIL=$((FAIL + 1))
            fi
          done

          printf '%b' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          echo "Bumped $SUBMODULE_NAME: $PASS passed, $FAIL failed (${#REPOS[@]} repos)" >> "$GITHUB_STEP_SUMMARY"
          echo "pass_count=$PASS" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL" >> "$GITHUB_OUTPUT"
          # INF-1046 (2026-10-30): a fully-failed write used to be a GREEN step with only a
          # warning annotation; the run then died at the verify step with no bump context, and
          # nothing ever retried the failed repo (concurrency-cancel class). Fail loud here.
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL repo(s) failed to bump (direct + gated). The pin chain for: $(echo "$RESULTS" | tr '\n' ' ') is BROKEN. Diagnose with the gated lines above; if none appear, the failure happened before the first gated echo."
            exit 1
          fi

      - name: Re-enable dangerous workflows
        if: always()
        run: |
          REENABLE_FAIL=0

          verify_active() {
            local repo="$1"
            local workflow_id="$2"
            local label="$3"
            local state
            state=$(gh api "repos/zapplyjobs/$repo/actions/workflows/$workflow_id" --jq '.state' 2>/dev/null || echo "FETCH_ERROR")
            if [ "$state" = "active" ]; then
              echo "Verified active: $label"
              echo "- $label: active" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$label state=$state after re-enable"
              echo "- $label: $state" >> "$GITHUB_STEP_SUMMARY"
              REENABLE_FAIL=$((REENABLE_FAIL + 1))
            fi
          }

          echo "### Workflow re-enable verification" >> "$GITHUB_STEP_SUMMARY"

          gh api repos/zapplyjobs/jobs-aggregator-engine/actions/workflows/234555372/enable --method PUT --silent && echo "Enabled: aggregator/Fetch All Jobs" || true
          gh api repos/zapplyjobs/jobs-data-2026/actions/workflows/239692001/enable --method PUT --silent && echo "Enabled: jobs-data/Enrich Jobs" || true
          # Consumer repos are pure display (Phase 4) — no workflows to re-enable

          verify_active "jobs-aggregator-engine" "234555372" "aggregator/Fetch All Jobs"
          verify_active "jobs-data-2026" "239692001" "jobs-data/Enrich Jobs"

          if [ "$REENABLE_FAIL" -gt 0 ]; then
            echo "::error::$REENABLE_FAIL workflow(s) were not active after re-enable"
            exit 1
          fi

      - name: Verify alignment
        run: |
          SUBMODULE_PATH="${{ steps.config.outputs.submodule_path }}"
          read -ra REPOS <<< "${{ steps.config.outputs.repos }}"
          P2_FAIL=0

          echo "### P-2 Verification ($SUBMODULE_NAME)" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected: ${TARGET_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for REPO in "${REPOS[@]}"; do
            REPO_NAME="${REPO#zapplyjobs/}"
            ACTUAL=$(gh api "repos/$REPO/contents/$SUBMODULE_PATH" --jq '.sha' 2>/dev/null || echo "FETCH_ERROR")

            if [ "$ACTUAL" = "$TARGET_SHA" ]; then
              echo "  $REPO_NAME: ${ACTUAL:0:12} OK" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "  $REPO_NAME: ${ACTUAL:0:12} MISMATCH (expected ${TARGET_SHA:0:12})" | tee -a "$GITHUB_STEP_SUMMARY"
              P2_FAIL=$((P2_FAIL + 1))
            fi

            HEAD=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || echo "")
            if [ -n "$HEAD" ]; then
              FILE_COUNT=$(gh api "repos/$REPO/git/trees/$HEAD" --jq '.tree | length' 2>/dev/null || echo "0")
              if [ "$FILE_COUNT" -lt 5 ]; then
                echo "  CRITICAL: $REPO_NAME has $FILE_COUNT files -- tree corruption" | tee -a "$GITHUB_STEP_SUMMARY"
                P2_FAIL=$((P2_FAIL + 1))
              fi
            fi
          done

          if [ "$P2_FAIL" -gt 0 ]; then
            echo "::error::P-2 verification failed: $P2_FAIL mismatch(es)"
            exit 1
          fi
          echo "**P-2 PASS** -- ${#REPOS[@]} repos aligned for $SUBMODULE_NAME at ${TARGET_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"

      - name: Final report
        if: always()
        run: |
          echo "### Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submodule: \`$SUBMODULE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target SHA: \`${TARGET_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bump: ${{ steps.bump.outputs.pass_count }} passed, ${{ steps.bump.outputs.fail_count }} failed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
