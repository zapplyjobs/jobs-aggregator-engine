name: gate

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check aggregator entrypoint
        run: node --check .github/scripts/index.js

      - name: Run script tests
        run: |
          set -euo pipefail
          for test_file in .github/scripts/__tests__/*.test.js; do
            node "$test_file"
          done
