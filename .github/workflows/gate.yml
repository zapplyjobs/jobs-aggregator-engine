name: gate

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - name: Check submodule pin ancestry - aggregator + consumer (AGG-PINANCESTOR-CONSUMER-1)
        run: bash .github/scripts/check-pin-ancestor.sh

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            if grep -q "filter=crypt" .gitattributes 2>/dev/null; then
              echo "Unlocking transcrypt in $name..."
              echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force
              git checkout -- .
              echo "✓ $name unlocked"
            else
              echo "Skipping $name (no transcrypt)"
            fi
          '
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Check for large files (>5MB)
        run: |
          LARGE_FILES=$(find . -not -path './.git/*' -not -path '*/node_modules/*' -type f -size +5M 2>/dev/null)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::Files larger than 5MB detected — use R2 or Git LFS instead of committing:"
            echo "$LARGE_FILES" | while read f; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "::error::$SIZE $f"
            done
            exit 1
          else
            echo "✅ No files larger than 5MB"
          fi

      - name: Check for data files in public repo
        run: |
          DATA_FILES=$(find .github/data -type f ! -name '.gitkeep' 2>/dev/null || true)
          if [ -n "$DATA_FILES" ]; then
            echo "::error::Data files detected in .github/data/ — these belong in R2/Supabase, not public git:"
            echo "$DATA_FILES" | while read f; do echo "::error::$f"; done
            exit 1
          else
            echo "✅ No data files in .github/data/"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check aggregator entrypoint
        run: node --check .github/scripts/index.js

      - name: Run script tests
        run: bash .github/scripts/test.sh
